[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:stacksim]
command=node bin/stacksim.mjs serve m365_azure --slug s1-mach --port 4390 --host 0.0.0.0
directory=/app/ces/tenant-stacksim
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/supervisor/stacksim.out.log
stderr_logfile=/var/log/supervisor/stacksim.err.log
priority=10

[program:muster-api]
command=node dist/server.js
directory=/app/ces/ces-muster/muster-api
autostart=true
autorestart=true
environment=PORT="4000",JWT_SECRET="%(ENV_JWT_SECRET)s",ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s"
stdout_logfile=/var/log/supervisor/muster-api.out.log
stderr_logfile=/var/log/supervisor/muster-api.err.log
priority=20

[program:muster-ui]
command=npx vite preview --host 0.0.0.0 --port 5173
directory=/app/ces/ces-muster
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/muster-ui.out.log
stderr_logfile=/var/log/supervisor/muster-ui.err.log
priority=25

[program:ec]
command=npm run start -w ces-ec
directory=/app/ces
autostart=true
autorestart=true
environment=CES_PIPELINE_ROOT="/app/data",EC_PORT="4001",EC_HOST="0.0.0.0"
stdout_logfile=/var/log/supervisor/ec.out.log
stderr_logfile=/var/log/supervisor/ec.err.log
priority=30

[program:eo]
command=node dist/eo/index.js
directory=/app/ces/ces-eo
autostart=true
autorestart=true
environment=CES_PIPELINE_ROOT="/app/data",EO_PORT="5004",CES_EO_BIND="0.0.0.0",CES_EO_OPERATOR_DEV_FALLBACK="1",REGISTRY_PATH="/app/ces/ces-stamper/src/registry/cmmc-l2-commands.registry.json",STORAGE_ROOT="/app/data",TENANT_SLUG="s1-mach",DOTNET_SYSTEM_GLOBALIZATION_INVARIANT="1"
stdout_logfile=/var/log/supervisor/eo.out.log
stderr_logfile=/var/log/supervisor/eo.err.log
priority=40

[program:stamper]
command=npm run gui -w ces-stamper -- --port 5002
directory=/app/ces
autostart=true
autorestart=true
environment=CES_PIPELINE_ROOT="/app/data"
stdout_logfile=/var/log/supervisor/stamper.out.log
stderr_logfile=/var/log/supervisor/stamper.err.log
priority=50

[program:ao]
command=npm run gui -w ces-ao -- --port 5003
directory=/app/ces
autostart=true
autorestart=true
environment=CES_PIPELINE_ROOT="/app/data"
stdout_logfile=/var/log/supervisor/ao.out.log
stderr_logfile=/var/log/supervisor/ao.err.log
priority=60

[program:demo-commander]
command=/bin/bash /app/docker/start-walkthrough.sh
directory=/app
autostart=true
autorestart=true
environment=CES_PIPELINE_ROOT="/app/data",WALKTHROUGH_ROOT="/app",CES_EO_OPERATOR_SECRET="%(ENV_CES_EO_OPERATOR_SECRET)s"
stdout_logfile=/var/log/supervisor/demo.out.log
stderr_logfile=/var/log/supervisor/demo.err.log
priority=90

