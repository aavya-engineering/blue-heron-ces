# secrets.inventory.yaml - every secret CES uses: what it is for, where it lives, who makes it. NO VALUES.
# Written by K2 (build-handoff kit agent 2; brief: AGENT-BRIEF-KIT.md). Every setting marked secret: true in
# Refreshed by H1 (handoff agent 1; brief: AGENT-BRIEF-HANDOFF2.md) on 2026-11-01: adds CES_TENANT_AUTH_TOKEN (PH-7).
# config.schema.yaml has an entry here; the entries after those are secrets that are not environment variables.
# sharedByBHD: false = the contractor makes it on their own machine (the default); true = BHD must grant it.
# "Module-secret store" = the DPAPI-protected file (DPAPI = Windows Data Protection API) written by
# ces-shared/scripts/New-CesModuleSecrets.ps1 and read by ces-shared/src/secrets/moduleSecrets.ts; default path
# %ProgramData%\CES\secrets\module-secrets.dpapi, or CES_MODULE_SECRETS_PATH. A store value wins over the environment.
schemaVersion: 1
secrets:
  - name: ANTHROPIC_API_KEY
    purpose: "Model-API key for muster-api's optional AI paths. AI runs only when this is set AND MUSTER_LIVE_CLIENT_ID is empty AND MUSTER_AI_SIM_ONLY is exactly '1'; AI paths are off for live tenants."
    component: [muster-api]
    store: "muster-api process environment (developer machine only); never on a customer VM"
    generatedBy: "Model provider account holder (BHD keeps BHD's key on the BHD workstation)"
    howToCreate: "Not needed to build or run the simulator path; leave unset. A contractor who wants to exercise the AI path uses their own provider key in their own dev environment."
    rotation: "Per the provider account's policy."
    scope: dev
    sharedByBHD: false
  - name: API_BEARER_TOKEN
    purpose: "Bearer token Stamper's generic API adapter adds to outgoing HTTP calls made by plan tasks (unless the task sets its own Authorization header). No CES service issues it; the target API depends on the plan task."
    component: [ces-stamper]
    store: "Stamper process environment"
    generatedBy: "The owner of the external API a plan task calls"
    howToCreate: "Not needed for the simulator path; set it only if a plan task calls an external API that needs a bearer token."
    rotation: "Per the external API's policy."
    scope: all
    sharedByBHD: false
  - name: CES_AO_AUTH_TOKEN
    purpose: "Bearer token that gates every AO (AdminOps, the change-execution server) /api/* route; callers send it as Authorization: Bearer."
    component: [ces-ao]
    store: "Module-secret store (DPAPI file), else the AO process environment"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1 (contractor runs it); the simulator harness <PKG>/scripts/mx-e2e.ps1 makes a fresh random one per run"
    howToCreate: "Run ces-shared/scripts/New-CesModuleSecrets.ps1 as the account that runs the CES services (CSPRNG, 32 bytes, base64url). For harness runs nothing is needed: mx-e2e.ps1 generates it."
    rotation: "Re-run New-CesModuleSecrets.ps1 -Force, then restart AO and every caller; old tokens stop working. No automatic rotation in code."
    scope: all
    sharedByBHD: false
  - name: CES_AO_PRINCIPAL_SECRET
    purpose: "HS256 signing secret (HMAC-SHA-256, a key shared by signer and verifier): EO signs AO approver tokens with it and AO verifies them. Must be at least 16 characters and must differ from CES_EO_OPERATOR_SECRET and CES_EC_PRINCIPAL_SECRET (EO refuses reuse)."
    component: [ces-ao, ces-eo]
    store: "Module-secret store (DPAPI file), else the environment of AO and EO (same value in both)"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1; the harness makes a fresh one per run"
    howToCreate: "Run New-CesModuleSecrets.ps1 on the machine that runs both AO and EO, so both read the same store."
    rotation: "Re-run New-CesModuleSecrets.ps1 -Force and restart AO and EO; outstanding approver tokens (15 to 30 minutes) become invalid."
    scope: all
    sharedByBHD: false
  - name: CES_AO_PRINCIPAL_TOKEN
    purpose: "A person's own short-lived AO approver token (minted by EO for one named approver, tenant-bound, 15 min default, 30 min max) that the 'ao approve' CLI reads so it stays out of shell history."
    component: [ces-ao]
    store: "The approver's shell environment, for the length of one approval"
    generatedBy: "EO's approver-token route, minted by an authenticated operator for a named approver (never self-minted); the harness signs one per run"
    howToCreate: "Ask an EO operator to mint an approver token for you, then set it just for the 'ao approve' command. Only needed when two-person approval (CES_TWO_PERSON_APPROVAL=1) or a verified approver is required."
    rotation: "Expires on its own (at most 30 minutes); never reused."
    scope: all
    sharedByBHD: false
  - name: CES_EC_PRINCIPAL_SECRET
    purpose: "HS256 signing secret: EO signs EC uploader tokens with it and EC (Evidence Collector) verifies the uploader's x-ces-principal token. Must differ from the AO principal and EO operator secrets."
    component: [ces-ec, ces-eo]
    store: "Module-secret store (DPAPI file), else the environment of EC and EO (same value in both)"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1; the harness makes a fresh one per run"
    howToCreate: "Run New-CesModuleSecrets.ps1 on the machine that runs EC and EO."
    rotation: "Re-run New-CesModuleSecrets.ps1 -Force and restart EC and EO; outstanding uploader tokens (60 minutes default, 8 hours max) become invalid."
    scope: all
    sharedByBHD: false
  - name: CES_EO_APPROVER_TOKEN
    purpose: "Approver token the 'eo' CLI review command sends to prove who the reviewer is when --approver-token is not given."
    component: [ces-eo]
    store: "The reviewer's shell environment, for one command"
    generatedBy: "EO's approver-token route (minted by an authenticated operator for a named reviewer)"
    howToCreate: "Have an EO operator mint a token for the reviewer; set it only for the review command."
    rotation: "Expires on its own (15 minutes default, 30 maximum)."
    scope: all
    sharedByBHD: false
  - name: CES_EO_AUTH_TOKEN
    purpose: "Bearer token that gates EO (EvidenceOps, the evidence and SSP server) /api/* routes; the eo CLI, muster-api and the tester send it."
    component: [ces-eo, ces-tester, muster-api]
    store: "Module-secret store (DPAPI file), else the process environment of EO and its callers"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1; the simulator harness makes a fresh random one per run"
    howToCreate: "Run New-CesModuleSecrets.ps1 (CSPRNG, 32 bytes, base64url); give the same value to muster-api (with CES_EO_URL) and to any eo CLI user."
    rotation: "Re-run New-CesModuleSecrets.ps1 -Force, then restart EO and muster-api. No automatic rotation in code."
    scope: all
    sharedByBHD: false
  - name: CES_EO_OPERATOR_SECRET
    purpose: "HS256 secret for the DEVELOPER-ONLY operator token fallback in EO (used only when CES_EO_OPERATOR_DEV_FALLBACK=1, no Entra or passkey config, loopback request; principals marked dev-unverified). Live operators sign in with passkeys or customer-issued Entra accounts instead."
    component: [ces-eo]
    store: "Module-secret store (DPAPI file), else the EO process environment"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1; the harness makes one per run for the simulator"
    howToCreate: "Only needed for simulator runs; mx-e2e.ps1 makes it. Do not enable the dev fallback on a live install."
    rotation: "Per harness run; on an install, re-run New-CesModuleSecrets.ps1 -Force."
    scope: sim
    sharedByBHD: false
  - name: CES_MUSTER_SECRETS_TOKEN
    purpose: "muster-api session JWT (role bhd_operator) that Stamper presents to POST /api/plan/secrets/resolve to fetch one-time secrets such as a new user's initial password."
    component: [ces-stamper]
    store: "Module-secret store (DPAPI file), else the Stamper process environment"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1 mints it as a muster-api JWT (HS256 with the JWT_SECRET made in the same run, role bhd_operator, -MusterTenantId, -MusterTokenHours default 8) since PH-7; the harness mints its own with <PKG>/scripts/mint-token.mjs (2 h)"
    howToCreate: "Run New-CesModuleSecrets.ps1 with JWT_SECRET in -Names (the default list) and -MusterTenantId set to the tenant_id of the operator token that compiles the plan. Renew before it expires with handoff/lib/Set-MusterSecretsToken.ps1 (or bootstrap.ps1 -ModuleSecretsPath)."
    rotation: "Expires with the JWT lifetime (default 8 h): re-mint with Set-MusterSecretsToken.ps1. Invalid at once if JWT_SECRET changes (New-CesModuleSecrets.ps1 -Force re-makes both)."
    scope: all
    sharedByBHD: false
  - name: CES_PFX_PASSWORD
    purpose: "Internal: carries a PFX import password from Stamper's certificate-import request into the PowerShell child's environment only (never its command line); removed in the child before import."
    component: [ces-shared]
    store: "One PowerShell child process environment, for one import"
    generatedBy: "CES itself (ces-shared PrerequisiteChecker), from the password the operator types in the import form"
    howToCreate: "Never set by hand."
    rotation: "Not applicable (transient)."
    scope: all
    sharedByBHD: false
  - name: CES_SIM_PFX_PASSWORD
    purpose: "Internal: random per-run password for the throwaway simulator PFX that ces-tester's AO step makes; passed only in the PowerShell child's environment."
    component: [ces-tester]
    store: "One PowerShell child process environment, for one harness run"
    generatedBy: "ces-tester (src/flow/ao-step.ts), automatically per run"
    howToCreate: "Never set by hand."
    rotation: "New per run. Leftover sim .pfx files from older runs may remain under run folders; delete them."
    scope: sim
    sharedByBHD: false
  - name: CES_STAMPER_AUTH_TOKEN
    purpose: "Bearer token the Stamper GUI server (the tenant-configuration engine) requires on its API calls."
    component: [ces-stamper]
    store: "Module-secret store (DPAPI file), else the Stamper process environment"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1"
    howToCreate: "Run New-CesModuleSecrets.ps1 (CSPRNG, 32 bytes, base64url)."
    rotation: "Re-run New-CesModuleSecrets.ps1 -Force, then restart Stamper. No automatic rotation in code."
    scope: all
    sharedByBHD: false
  - name: CES_TENANT_AUTH_TOKEN
    purpose: "Bearer token of the optional ces-tenant service daemon (auth-state-only tenant service); network callers must send it, loopback callers need none while it is unset."
    component: [ces-tenant]
    store: "Process environment of the daemon and of every ces-tenant client that talks to it (the daemon does not read the module-secret store)"
    generatedBy: "contractor (any CSPRNG, for example New-CesModuleSecrets.ps1 -Names CES_TENANT_AUTH_TOKEN, then copy the value into both environments)"
    howToCreate: "Make 32 random bytes, encode base64url, and set the same value for the daemon and its clients. Only needed when the daemon is reached over the network."
    rotation: "Set a new value on the daemon and its clients together, then restart the daemon. No automatic rotation in code."
    scope: all
    sharedByBHD: false
  - name: DATABASE_URL
    purpose: "Legacy PostgreSQL connection string (it carries the database password) read only by the one-off muster-api 'engagementMigrate export' command, which copies a legacy PostgreSQL database into JSON for ces.db; no server reads it."
    component: [muster-api]
    store: "Shell environment of the one migration run"
    generatedBy: "Whoever owns the legacy PostgreSQL database"
    howToCreate: "Not needed: a fresh build uses SQLite (ces.db) only. Set it only to migrate an old PostgreSQL engagement database."
    rotation: "Not applicable (one-off)."
    scope: dev
    sharedByBHD: false
  - name: EVIDENCE_OPS_SECRET
    purpose: "Bearer secret for EC's authenticated routes (ingest, index, items); EO attaches it when it calls EC. Unset = those EC routes are disabled (fail closed)."
    component: [ces-ec, ces-eo]
    store: "Module-secret store (DPAPI file), else the environment of EC and EO (same value in both)"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1; the harness makes one per run"
    howToCreate: "Run New-CesModuleSecrets.ps1 on the machine that runs EC and EO."
    rotation: "Re-run New-CesModuleSecrets.ps1 -Force and restart EC and EO. No automatic rotation in code."
    scope: all
    sharedByBHD: false
  - name: JWT_SECRET
    purpose: "HS256 secret that signs and verifies muster-api user session JWTs (default lifetime 8 h, JWT_EXPIRES_IN); muster-api refuses to start without it."
    component: [muster-api]
    store: "Module-secret store (DPAPI file), else the muster-api process environment"
    generatedBy: "ces-shared/scripts/New-CesModuleSecrets.ps1; the harness makes one per run"
    howToCreate: "Run New-CesModuleSecrets.ps1."
    rotation: "Re-run New-CesModuleSecrets.ps1 -Force and restart muster-api; every existing session JWT (including CES_MUSTER_SECRETS_TOKEN and MU_TOKEN values) becomes invalid and must be re-minted."
    scope: all
    sharedByBHD: false
  - name: MU_PASSWORD
    purpose: "Login password for 'mu login' (the muster-api CLI) when --password is not given."
    component: [muster-api]
    store: "The CLI user's shell environment for one login"
    generatedBy: "The muster-api user (set at seed time with SEED_PASSWORD, or by an operator)"
    howToCreate: "Use the password of the muster-api user you created with the seed script."
    rotation: "Change the user's password in muster-api."
    scope: all
    sharedByBHD: false
  - name: MU_TOKEN
    purpose: "muster-api session JWT the mu CLI uses when --token is not given, before falling back to the saved credential file (~/.muster/credentials.json, plaintext)."
    component: [muster-api]
    store: "The CLI user's shell environment, else %USERPROFILE%\\.muster\\credentials.json"
    generatedBy: "muster-api, at 'mu login'"
    howToCreate: "Run 'mu login'; the token is saved for later commands."
    rotation: "Expires with the JWT lifetime (8 h default); invalid at once if JWT_SECRET changes."
    scope: all
    sharedByBHD: false
  - name: MUSTER_LIVE_AREA_TOKEN
    purpose: "Internal: delegated (device-code consent) access token that muster-api puts only into the environment of each live-discovery PowerShell child (Exchange, Purview, Azure, Teams)."
    component: [muster-api]
    store: "muster-api process memory, then one PowerShell child's environment; never on disk"
    generatedBy: "The customer administrator's device-code consent in muster-api's live-access flow"
    howToCreate: "Never set by hand; live tenants only."
    rotation: "Dropped at expiry, on abort, or when the engagement's live flag is turned off."
    scope: live
    sharedByBHD: false
  - name: MUSTER_LIVE_GRAPH_TOKEN
    purpose: "Internal: delegated Microsoft Graph access token that muster-api puts only into the environment of the live-discovery PowerShell child for Connect-MgGraph."
    component: [muster-api]
    store: "muster-api process memory, then one PowerShell child's environment; never on disk"
    generatedBy: "The customer administrator's device-code consent in muster-api's live-access flow"
    howToCreate: "Never set by hand; live tenants only."
    rotation: "Dropped at expiry, on abort, or when the engagement's live flag is turned off."
    scope: live
    sharedByBHD: false
  - name: SEED_PASSWORD
    purpose: "Password the muster-api seed script hashes (bcrypt) for the operator user it creates or updates, when --password is not given."
    component: [muster-api]
    store: "Shell environment of one seed run (prefer it to --password, which shows on the command line)"
    generatedBy: "The contractor, choosing a password for their own operator user"
    howToCreate: "Pick a strong password, set it for the seed run only, then clear it."
    rotation: "Re-run the seed script with a new password."
    scope: dev
    sharedByBHD: false
  - name: STAMPER_INITIAL_PASSWORD
    purpose: "Older path: the Stamper CLI fills a plan's unresolved initialPassword variable from this into its in-memory, redacted secret overlay. The harness now uses muster-api's one-time secret reference instead."
    component: [ces-stamper]
    store: "Stamper CLI process environment"
    generatedBy: "The operator running the Stamper CLI"
    howToCreate: "Not needed for the harness. If used, set a CSPRNG password for one run and clear it."
    rotation: "Per run."
    scope: dev
    sharedByBHD: false
  - name: tenant-app-certificate
    purpose: "The Graph app credential: the private key of the self-signed certificate that the CES Entra app registration uses for app-only sign-in to Microsoft Graph, Exchange Online and Purview. Every PowerShell connect passes -CertificateThumbprint and Windows resolves the key from the store. The app ID, tenant ID and thumbprint are identifiers, not secrets; they live in the tenant record."
    component: [ces-stamper, ces-ao, ces-eo, ces-tenant, muster-api]
    store: "Windows certificate store Cert:\\CurrentUser\\My of the account that runs CES, non-exportable key; only the public .cer is written (default C:\\stamper-certs). The tenant record lives in the ces-tenant registry (CES_TENANT_ROOT)."
    generatedBy: "ces-stamper/scripts/New-TenantBootstrap.ps1 (run by a Global Administrator of the target tenant); for the simulator, the same script with -Simulator, or the harness's throwaway sim certificate"
    howToCreate: "Simulator first: run New-TenantBootstrap.ps1 -Simulator (needs STACKSIM_SERVER_URL and a sim-tenant-* id) or let the harness make one. Live: in the contractor's own GCC High tenant, run New-TenantBootstrap.ps1 -Environment GCCHigh; it creates the app, the 2-year non-exportable certificate, and grants the Graph application permissions listed in the script (lines 437-476) plus Exchange.ManageAsApp. Sites.FullControl.All is held unless CES_HELD_STANDING_GRANTS_ENABLED is 'true'. Review that permission list for least privilege before granting."
    rotation: "Before the 2-year expiry, re-run New-TenantBootstrap.ps1: it APPENDS the new certificate to the app's key credentials, so other machines keep working; then remove the old credential from the app registration."
    scope: all
    sharedByBHD: false
  - name: evidence-storage-account-key
    purpose: "Azure Storage account key used for SharedKey signing when Stamper or EO upload evidence to blob storage (tenant record field evidence_storage.account_key)."
    component: [ces-shared, ces-stamper, ces-eo]
    store: "Tenant record, preferably as an env:NAME reference resolved at load time (fails closed when unset); CES_STRICT_SECRETS=1 refuses a literal value"
    generatedBy: "The owner of the Azure storage account (the contractor's own subscription)"
    howToCreate: "Not needed for the simulator path. For live, create a storage account in your own subscription only through the cost gate (two operator confirmations: any recurring-cost action is off by default) and store the key as an env: reference."
    rotation: "Regenerate the key in Azure, update the referenced environment variable, restart the readers."
    scope: live
    sharedByBHD: false
  - name: eo-operator-passkey
    purpose: "How an operator signs in to EO on an install to mint approver and uploader tokens (FC-EO-G): a passkey whose private key stays on the operator's authenticator; ces.db holds only the public key and a hashed enrollment code."
    component: [ces-eo]
    store: "The operator's authenticator (private key); ces.db (public key, hashed enrollment code)"
    generatedBy: "The operator, at enrollment on the EO machine (CES_EO_OPERATOR_PASSKEY_ORIGIN and CES_EO_OPERATOR_PASSKEY_RP_ID configure it)"
    howToCreate: "Enroll with the EO passkey CLI on the EO machine. Simulator runs may use the dev fallback (CES_EO_OPERATOR_DEV_FALLBACK=1) instead."
    rotation: "Revoke the passkey in EO and enroll a new one; sessions last at most 15 minutes and are re-checked against revocation."
    scope: live
    sharedByBHD: false
  - name: github-org-access
    purpose: "Read access to the private GitHub organisation that holds the CES repositories; delivery is through that org plus a link, never an emailed script or zip."
    component: []
    store: "The contractor's own GitHub account (BHD grants membership; no secret value changes hands)"
    generatedBy: "BHD owner, by inviting the contractor's GitHub account"
    howToCreate: "Send BHD your GitHub username; accept the invitation; authenticate git with your own credential."
    rotation: "BHD removes the membership on the access-revocation date in ACCEPTANCE.md."
    scope: all
    sharedByBHD: true
  - name: gcc-high-scoped-guest
    purpose: "OPTIONAL: least-privilege guest access to a GCC High tenant, only if the contractor has no GCC High tenant of their own for the live phase. The simulator needs nothing from BHD."
    component: []
    store: "The contractor's own guest identity in that tenant (no secret value changes hands)"
    generatedBy: "The tenant's administrator (BHD owner arranges it), by inviting the contractor as a guest with only the roles the live test needs"
    howToCreate: "Ask BHD only after the simulator acceptance passes; prefer your own GCC High tenant."
    rotation: "Removed on the access-revocation date in ACCEPTANCE.md, or earlier when the live test ends."
    scope: live
    sharedByBHD: true
  - name: release-signing-key
    purpose: "Listed so nobody looks for it: BHD's release-signing private key (one hardware key) never leaves BHD; only its public verification key is published. The contractor does not need it to build, run or prove CES."
    component: []
    store: "BHD hardware key on a BHD signing station"
    generatedBy: "BHD owner"
    howToCreate: "Not applicable to the contractor."
    rotation: "BHD's decision."
    scope: live
    sharedByBHD: false
# Legend (codes used in the descriptions above):
#   AO = AdminOps, the change-execution server (ces-ao). EO = EvidenceOps, the evidence, SSP and approval server (ces-eo).
#   EC = Evidence Collector, the evidence ingest server (ces-ec). Stamper = the tenant-configuration engine (ces-stamper).
#   Muster / muster-api = the readiness-assessment app and its API (ces-muster). stacksim = the tenant simulator (tenant-stacksim).
#   SSP = System Security Plan. UPN = a user's sign-in name. PFX = a password-protected file holding a private key.
#   DPAPI = Windows Data Protection API; the module-secret store is a DPAPI file (ces-shared/src/secrets/moduleSecrets.ts).
#   secretEnv() = the read-only view of the environment in which a module-secret store value wins (same file).
#   HS256 = HMAC-SHA-256 signing with a key shared by signer and verifier. JWT = JSON Web Token.
#   CSPRNG = cryptographically secure random number generator. Entra = Microsoft Entra ID (Azure AD).
#   GCC High = Microsoft's US-government cloud for defense contractors. CUI = Controlled Unclassified Information.
#   Sim-only rail = the guard that refuses non-simulator tenants unless explicitly allowed.
#   SP-n, F-n, R-n = secrets-plan slices, flags and risks (BHD secrets plan; names only, no action needed by the contractor).
