# config.schema.yaml - every setting (environment variable) the CES code reads, one entry each.
# Written by K2 (build-handoff kit agent 2; brief: AGENT-BRIEF-KIT.md) from a read of the code at the
# Refreshed by H1 (handoff agent 1; brief: AGENT-BRIEF-HANDOFF2.md) on 2026-11-01 to the PH-13 code (branch fin/ph13).
# commits in handoff.manifest.yaml. "source" is the primary reader, as path:line relative to the ces-mono
# workspace root (nested repos ces-muster, ces-tester, tenant-stacksim, ces-tenant appear as their folders).
# secret: true means the value never appears in this kit; see secrets.inventory.yaml.
# owner: BHD = BHD holds or decides it; contractor = whoever builds and runs the kit; operator = chosen per CES install.
# scope: dev = test harness and development only; sim = simulator runs; live = live tenants only; all = everywhere.
# A description that starts "UNCLEAR:" records what the code showed where its meaning could not be settled.
schemaVersion: 1
settings:
  - name: ACTIVE_TENANT_SLUG
    component: [ces-eo]
    required: false
    default: "unset = EO uses TENANT_SLUG, the tenant config, or the last-used tenant"
    allowed: "a tenant slug registered in the ces-tenant registry"
    secret: false
    owner: operator
    scope: all
    description: "Picks the tenant EO starts on; when set, EO refuses to start unless that slug is in the tenant registry, and it is used only if TENANT_SLUG and the tenant config give no slug."
    source: "ces-eo/src/eo/config/EoConfig.ts:183"
  - name: ANTHROPIC_API_KEY
    component: [muster-api]
    required: false
    default: "unset = AI paths off"
    allowed: "a model-API key string"
    secret: true
    owner: BHD
    scope: dev
    description: "Model-API key for muster-api's AI paths; AI runs only when this is set AND MUSTER_LIVE_CLIENT_ID is empty AND MUSTER_AI_SIM_ONLY is exactly '1', so it is never used with live tenant access."
    source: "ces-muster/muster-api/src/lib/claude.ts:34"
  - name: AO_CMMC_STRICT
    component: [ces-ao]
    required: false
    default: "unset = off for the CUI-boundary parameter check; the CMMC scope gate is strict regardless (CMMC_STRICT_DEFAULT = true)"
    allowed: "'1' = strict; anything else = not strict (cannot turn the scope gate's built-in strict default off)"
    secret: false
    owner: operator
    scope: all
    description: "When exactly '1', makes AO's CUI-boundary parameter check strict (denies the ambiguous 'case-a' boundary values); AO's CMMC scope gate is already strict by default, so '1' only confirms it there."
    source: "ces-ao/src/execution/ParameterMapper.ts:155"
  - name: AO_LOG_REQUESTS
    component: [ces-ao]
    required: false
    default: "unset = quiet request logging"
    allowed: "'all' = log every request; anything else = quiet"
    secret: false
    owner: operator
    scope: all
    description: "When exactly 'all', AO's request logger logs every HTTP request instead of the quiet default; read once at start, so a change needs a restart."
    source: "ces-ao/src/server/middleware/quietRequestLogger.ts:37"
  - name: AO_MCP_ALLOW_APPLY
    component: [ces-ao]
    required: false
    default: "unset = MCP calls are dry-run only"
    allowed: "'1' = live writes allowed; anything else = dry-run only"
    secret: false
    owner: operator
    scope: all
    description: "When exactly '1', lets the AO MCP server (ces-adminops-mcp) run AdminOps commands for real (dryRun:false); otherwise every MCP execute is a dry-run preview."
    source: "ces-ao/src/mcp/aoMcpTools.ts:104"
  - name: API_BEARER_TOKEN
    component: [ces-stamper]
    required: false
    default: "unset = no Authorization header added"
    allowed: "a bearer token string"
    secret: true
    owner: operator
    scope: all
    description: "Bearer token Stamper's API adapter adds as the Authorization header on outgoing HTTP calls made by plan tasks, unless the task already sets one."
    source: "ces-stamper/src/adapters/APIAdapter.ts:106"
  - name: APP_ID
    component: [ces-stamper]
    required: false
    default: "''"
    allowed: "an Entra application (client) ID GUID"
    secret: false
    owner: operator
    scope: all
    description: "Entra app (client) ID Stamper uses for certificate sign-in to the tenant, read from the environment or Stamper's .env file (dotenv)."
    source: "ces-stamper/src/config/StamperConfig.ts:100"
  - name: AZURE_AUTH_ENDPOINT
    component: [ces-stamper]
    required: false
    default: "<stack login endpoint>/organizations (from the active stack provider)"
    allowed: "an https URL"
    secret: false
    owner: operator
    scope: live
    description: "Overrides the Azure sign-in authority URL Stamper uses; by default it is derived from the active cloud stack's login endpoint plus '/organizations'."
    source: "ces-stamper/src/config/StamperConfig.ts:108"
  - name: CERT_PATH
    component: [ces-stamper]
    required: false
    default: "''"
    allowed: "a file path to the tenant certificate (.pfx)"
    secret: false
    owner: operator
    scope: all
    description: "Path to the tenant certificate file Stamper uses for app sign-in, read from the environment or Stamper's .env file."
    source: "ces-stamper/src/config/StamperConfig.ts:102"
  - name: CERT_THUMBPRINT
    component: [ces-stamper]
    required: false
    default: "''"
    allowed: "a 40-hex-character certificate thumbprint"
    secret: false
    owner: operator
    scope: all
    description: "Thumbprint of the tenant certificate Stamper signs in with (identifies the key in the Windows certificate store; not itself a secret), read from the environment or Stamper's .env file."
    source: "ces-stamper/src/config/StamperConfig.ts:101"
  - name: CES_AO_ALLOW_LIVE
    component: [ces-ao]
    required: false
    default: "unset = live (non-sim) tenants refused"
    allowed: "'1' = opt in to live; anything else = sim only"
    secret: false
    owner: operator
    scope: live
    description: "When exactly '1' (and CES_AO_SIM_ONLY is not '1'), lets AO run commands against a tenant record explicitly marked kind 'live'; otherwise AO refuses every non-sim tenant, dry-runs included."
    source: "ces-ao/src/execution/SimOnlyRail.ts:59"
  - name: CES_AO_AUTH_TOKEN
    component: [ces-ao]
    required: false
    default: "unset = dev mode: loopback callers trusted, network callers refused"
    allowed: "any non-empty string (generated: 43-char base64url)"
    secret: true
    owner: contractor
    scope: all
    description: "Bearer token every AO /api/* call must carry once set (health stays open); unset means loopback requests pass without a token and network requests get 401; read through secretEnv(): a DPAPI store value wins over the environment."
    source: "ces-ao/src/server/AoServer.ts:176"
  - name: CES_AO_BIND
    component: [ces-ao]
    required: false
    default: "'all' (every interface)"
    allowed: "'all' or one listen address (IP or hostname)"
    secret: false
    owner: operator
    scope: all
    description: "Address AO's server listens on; unset or 'all' listens on every interface (tokens gate access), any other value binds that one address."
    source: "ces-ao/src/server/AoServer.ts:38"
  - name: CES_AO_DEV_PRINCIPAL_TENANT
    component: [ces-ao]
    required: false
    default: "unset = the dev principal can decide no approvals"
    allowed: "a tenant ID (GUID)"
    secret: false
    owner: contractor
    scope: dev
    description: "Tenant ID attached to AO's loopback dev principal (set by CES_AO_DEV_PRINCIPAL_UPN), so it may decide approvals for that tenant only; without it the dev principal is refused (fail closed)."
    source: "ces-ao/src/server/principal.ts:88"
  - name: CES_AO_DEV_PRINCIPAL_UPN
    component: [ces-ao]
    required: false
    default: "unset = no dev principal"
    allowed: "a user principal name (email form)"
    secret: false
    owner: contractor
    scope: dev
    description: "When set, AO accepts an unverified local dev principal with this UPN and the approver role (marked 'dev-unverified'), for development without signed principal tokens."
    source: "ces-ao/src/server/principal.ts:48"
  - name: CES_AO_E2E_OUT
    component: [ces-ao-ui]
    required: false
    default: "C:/ces-nb/out/ui/ao/playwright"
    allowed: "a directory path"
    secret: false
    owner: contractor
    scope: dev
    description: "Output folder for the AO console's Playwright end-to-end run (reports, traces, video)."
    source: "ces-ao/ui/playwright.config.ts:22"
  - name: CES_AO_E2E_PORT
    component: [ces-ao-ui]
    required: false
    default: "5103"
    allowed: "a TCP port number"
    secret: false
    owner: contractor
    scope: dev
    description: "Port the AO console's Playwright end-to-end run starts its own AO server on (kept off the simulator's 4390)."
    source: "ces-ao/ui/playwright.config.ts:20"
  - name: CES_AO_LEAVER_TENANTS
    component: [ces-ao]
    required: false
    default: "unset = no leaver timer"
    allowed: "comma-separated tenant slugs"
    secret: false
    owner: operator
    scope: all
    description: "Tenants the leaver-flow timer scans for leavers and advances (reminders, escalations) every CES_AO_LEAVER_TICK_MIN minutes; the timer runs only when both settings are set. A scan reads the tenant."
    source: "ces-ao/src/server/routes/leaver.routes.ts:230"
  - name: CES_AO_LEAVER_SINCE
    component: [ces-ao]
    required: false
    default: "unset = every earlier flow for a leaver counts as tracking that leaver"
    allowed: "an ISO 8601 time"
    secret: false
    owner: contractor
    scope: sim
    description: "Simulator run window (as EO's CES_EO_ADMINOPS_SINCE): the leaver flow's 'already tracked' check ignores flows created before this ISO time, so an earlier run's flow for the same seeded leaver does not block this run's flow. The tester sets it to E1's start; a real deployment leaves it unset."
    source: "ces-ao/src/server/AoServer.ts:136"
  - name: CES_AO_LEAVER_TICK_MIN
    component: [ces-ao]
    required: false
    default: "unset = off (no timer, no scan)"
    allowed: "a positive number of minutes"
    secret: false
    owner: operator
    scope: all
    description: "Interval of the optional leaver-flow timer (scan + tick for each tenant in CES_AO_LEAVER_TENANTS); without it, scans and ticks run only through POST /api/leaver/scan and /api/leaver/tick."
    source: "ces-ao/src/server/routes/leaver.routes.ts:229"
  - name: CES_AO_PORT
    component: [ces-ao]
    required: false
    default: "the port AO listens on (AO fills it in at start); 3001 if neither is known"
    allowed: "a TCP port number"
    secret: false
    owner: operator
    scope: all
    description: "Port used only to build the default CES_AO_PUBLIC_URL for leaver confirm links; it does not choose the port AO listens on (that is the --port flag)."
    source: "ces-ao/src/server/AoServer.ts:134"
  - name: CES_AO_PRINCIPAL_AUDIENCE
    component: [ces-ao, ces-eo]
    required: false
    default: "unset = audience not set or checked"
    allowed: "any string"
    secret: false
    owner: operator
    scope: all
    description: "Optional 'aud' claim EO writes into AO approver tokens and that AO and EO then require when verifying them."
    source: "ces-ao/src/server/principal.ts:56"
  - name: CES_AO_PRINCIPAL_ISSUER
    component: [ces-ao, ces-eo]
    required: false
    default: "unset = issuer not set or checked"
    allowed: "any string"
    secret: false
    owner: operator
    scope: all
    description: "Optional 'iss' claim EO writes into AO approver tokens and that AO and EO then require when verifying them."
    source: "ces-ao/src/server/principal.ts:55"
  - name: CES_AO_PRINCIPAL_SECRET
    component: [ces-ao, ces-eo]
    required: false
    default: "unset = AO accepts no signed principal tokens and EO cannot mint approver tokens (503)"
    allowed: "string of at least 16 characters; must differ from CES_EO_OPERATOR_SECRET and CES_EC_PRINCIPAL_SECRET"
    secret: true
    owner: contractor
    scope: all
    description: "HS256 signing secret shared by EO (mints AO approver tokens) and AO (verifies the x-ces-principal token on approvals); read through secretEnv(): a DPAPI store value wins over the environment."
    source: "ces-ao/src/server/principal.ts:47"
  - name: CES_AO_PRINCIPAL_TOKEN
    component: [ces-ao]
    required: false
    default: "unset = pass --principal-token instead"
    allowed: "a signed approver token minted by EO"
    secret: true
    owner: operator
    scope: all
    description: "The approving person's own signed principal token, read by the 'ao approve' CLI (keeps it out of shell history); the approver recorded is the token's UPN and self-approval is refused."
    source: "ces-ao/src/execution/VerifiedApprover.ts:35"
  - name: CES_AO_PROBE_STORE
    component: [ces-ao]
    required: false
    default: "Cert:\\CurrentUser\\My then Cert:\\LocalMachine\\My"
    allowed: "a PowerShell certificate store path"
    secret: false
    owner: contractor
    scope: all
    description: "Internal: set by AO itself in the environment of its certificate-probe PowerShell child to name the store to search for the tenant certificate; not an operator setting."
    source: "ces-ao/src/execution/AuthChain.ts:114"
  - name: CES_AO_PROBE_THUMB
    component: [ces-ao]
    required: false
    default: "set by AO per probe"
    allowed: "a certificate thumbprint"
    secret: false
    owner: contractor
    scope: all
    description: "Internal: set by AO itself in the environment of its certificate-probe PowerShell child to pass the thumbprint being looked up; not an operator setting."
    source: "ces-ao/src/execution/AuthChain.ts:113"
  - name: CES_AO_PUBLIC_URL
    component: [ces-ao]
    required: false
    default: "http://localhost:<CES_AO_PORT>"
    allowed: "an http(s) base URL that tenant administrators can reach"
    secret: false
    owner: operator
    scope: all
    description: "Base of the single-use confirm links that the leaver flow puts in each confirmation request to a tenant administrator (route /api/leaver/confirm/<flowId>); set it to AO's address as administrators see it."
    source: "ces-ao/src/server/AoServer.ts:134"
  - name: CES_AO_SIM_ONLY
    component: [ces-ao]
    required: false
    default: "unset = no lockdown (live still needs CES_AO_ALLOW_LIVE=1)"
    allowed: "'1' = lockdown; anything else = no lockdown"
    secret: false
    owner: contractor
    scope: sim
    description: "When exactly '1', AO refuses every non-sim tenant even if CES_AO_ALLOW_LIVE=1 (lockdown beats opt-in); the harness sets it on every AO it starts."
    source: "ces-ao/src/execution/SimOnlyRail.ts:92"
  - name: CES_AT_REST_OVERRIDE_FILE
    component: [ces-shared]
    required: false
    default: "unset = no override record"
    allowed: "a file path to a 'ces-at-rest-override' JSON record"
    secret: false
    owner: operator
    scope: live
    description: "Path to the operator's recorded acknowledgment that lets a release build start even though the at-rest encryption check (Azure encryption at host or BitLocker) cannot show the data volumes are encrypted."
    source: "ces-shared/src/security/atRestCheck.ts:31"
  - name: CES_BHD_NOTICE_MAILBOX
    component: [ces-ao]
    required: false
    default: "unset = an opted-in done notice is recorded as undeliverable"
    allowed: "one mailbox address (a BHD role mailbox, never a person)"
    secret: false
    owner: BHD
    scope: all
    description: "BHD role mailbox that receives a leaver-flow done notice, only for tenants whose leaver setting notifyBhdOnDone is on (customer opt-in, default off, set through PUT /api/leaver/settings); messages go to AO's simulated outbox and are not sent by CES."
    source: "ces-ao/src/server/AoServer.ts:135"
  - name: CES_CONFIG_PATH
    component: [ces-shared]
    required: false
    default: "{CES_PIPELINE_ROOT}\\ces.config.json"
    allowed: "a file path"
    secret: false
    owner: operator
    scope: all
    description: "Explicit path to the CES config file (customer bindings); an absent file means an empty config, a malformed one throws."
    source: "ces-shared/src/config/cesConfig.contract.ts:61"
  - name: CES_COST_DP2_TIMEOUT_MS
    component: [ces-stamper]
    required: false
    default: "600000 (10 minutes)"
    allowed: "a positive number of milliseconds; anything else = default"
    secret: false
    owner: operator
    scope: all
    description: "How long Stamper's GUI cost gate waits for the operator's second confirmation (DP-2) on a recurring-cost step before giving up."
    source: "ces-stamper/src/server/guiCostGate.ts:90"
  - name: CES_COST_ESTIMATES_PATH
    component: [ces-ao]
    required: false
    default: "ces-shared/src/data/cost-estimates.reference.json"
    allowed: "a file path"
    secret: false
    owner: operator
    scope: all
    description: "Overrides the location of the price file AO's cost gate reads to show the recurring cost of an operation."
    source: "ces-ao/src/execution/CostGate.ts:37"
  - name: CES_E9_EC_PORT
    component: [ces-tester]
    required: false
    default: "4013"
    allowed: "a TCP port number"
    secret: false
    owner: contractor
    scope: dev
    description: "Port for the second EC the tester's FIN-29 E9 scenario starts (set it when 4013 is in use)."
    source: "ces-tester/src/flow/fin29-eo-muster.ts:313"
  - name: CES_E9_EO_PORT
    component: [ces-tester]
    required: false
    default: "4012"
    allowed: "a TCP port number"
    secret: false
    owner: contractor
    scope: dev
    description: "Port for the second EO the tester's FIN-29 E9 scenario starts (set it when 4012 is in use)."
    source: "ces-tester/src/flow/fin29-eo-muster.ts:67"
  - name: CES_EC_AUTOSTART
    component: [ces-shared, ces-stamper]
    required: false
    default: "unset = never start EC automatically"
    allowed: "'1' = auto-start; anything else = off"
    secret: false
    owner: operator
    scope: all
    description: "When exactly '1', the shared EC launcher (used by Stamper at start) spawns the Evidence Collector if its health check fails; otherwise it only reports EC as down."
    source: "ces-shared/src/launcher/EcLauncher.ts:126"
  - name: CES_EC_CWD
    component: [ces-shared]
    required: false
    default: "<caller's working directory>/../ces-ec"
    allowed: "a directory path"
    secret: false
    owner: contractor
    scope: all
    description: "Working directory the shared EC launcher starts the Evidence Collector from when it auto-starts it."
    source: "ces-shared/src/launcher/EcLauncher.ts:84"
  - name: CES_EC_PRINCIPAL_AUDIENCE
    component: [ces-ec, ces-eo]
    required: false
    default: "unset = audience not set or checked"
    allowed: "any string"
    secret: false
    owner: operator
    scope: all
    description: "Optional 'aud' claim EO writes into EC uploader tokens and that EC then requires when verifying them."
    source: "ces-ec/src/config.ts:40"
  - name: CES_EC_PRINCIPAL_ISSUER
    component: [ces-ec, ces-eo]
    required: false
    default: "unset = issuer not set or checked"
    allowed: "any string"
    secret: false
    owner: operator
    scope: all
    description: "Optional 'iss' claim EO writes into EC uploader tokens and that EC then requires when verifying them."
    source: "ces-ec/src/config.ts:39"
  - name: CES_EC_PRINCIPAL_SECRET
    component: [ces-ec, ces-eo]
    required: false
    default: "unset = EC accepts no uploader tokens and EO cannot mint them (503)"
    allowed: "string of at least 16 characters; must differ from CES_AO_PRINCIPAL_SECRET and CES_EO_OPERATOR_SECRET"
    secret: true
    owner: contractor
    scope: all
    description: "HS256 signing secret shared by EO (mints uploader tokens) and EC (verifies the uploader's x-ces-principal token); read through secretEnv(): a DPAPI store value wins over the environment."
    source: "ces-eo/src/eo/uploader-tokens/UploaderTokenIssuer.ts:109"
  - name: CES_EC_SIM_ONLY
    component: [ces-ec]
    required: false
    default: "on (sim only)"
    allowed: "'0' = live tenants allowed; any other value or unset = sim only"
    secret: false
    owner: operator
    scope: all
    description: "EC's sim-only rail: on unless exactly '0', it refuses ingest for any tenant not marked kind 'sim' (fail closed); '0' also admits tenants marked kind 'live'."
    source: "ces-ec/src/config.ts:34"
  - name: CES_EO_ADMINOPS_SINCE
    component: [ces-eo]
    required: false
    default: "unset = EO reads the whole AdminOps history"
    allowed: "an ISO 8601 time"
    secret: false
    owner: contractor
    scope: sim
    description: "Simulator run window: EO's AdminOps evidence reader skips every AdminOps row timed before this ISO time; a real deployment leaves it unset (six-year retention)."
    source: "ces-eo/src/eo/adminops/AdminOpsEvidenceReader.ts:65"
  - name: CES_EO_APPROVER_TOKEN
    component: [ces-eo]
    required: false
    default: "unset = pass --approver-token instead"
    allowed: "a minted approver token"
    secret: true
    owner: operator
    scope: all
    description: "Approver token the 'eo' CLI review command sends to prove the reviewer when --approver-token is not given."
    source: "ces-eo/src/cli/eo.ts:328"
  - name: CES_EO_AUTH_TOKEN
    component: [ces-eo, ces-tester, muster-api]
    required: false
    default: "unset = EO dev mode (loopback trusted, network refused); muster-api skips its EO calls"
    allowed: "any non-empty string (generated: 43-char base64url)"
    secret: true
    owner: contractor
    scope: all
    description: "Bearer token for EO's /api/* routes: EO requires it once set, and the eo CLI, muster-api (with CES_EO_URL) and the tester send it; read through secretEnv() on EO: a DPAPI store value wins over the environment."
    source: "ces-eo/src/eo/server/authMiddleware.ts:35"
  - name: CES_EO_BIND
    component: [ces-eo]
    required: false
    default: "unset = every interface"
    allowed: "one listen address (IP or hostname); '0.0.0.0' or '::' = all"
    secret: false
    owner: operator
    scope: all
    description: "Address EO listens on (unset = every interface, tokens gate access); EO also uses it to pick the address its scheduler calls itself on (127.0.0.1 when unset or a wildcard)."
    source: "ces-eo/src/eo/index.ts:36"
  - name: CES_EO_COLLECT_FIRST_TICK_SEC
    component: [ces-eo]
    required: false
    default: "the assess interval (SIGNAL_CAPTURE_INTERVAL_HOURS, 24 h)"
    allowed: "a number of seconds >= 0"
    secret: false
    owner: operator
    scope: all
    description: "Delay in seconds before EO's collection scheduler first ticks; proof rounds set a short value to see a tick."
    source: "ces-eo/src/eo/collect/collectionScheduler.ts:97"
  - name: CES_EO_COLLECT_LIVE
    component: [ces-eo]
    required: false
    default: "unset = only live tenants named in CES_EO_COLLECT_TENANTS (plus connected operator sessions)"
    allowed: "'1' = collect every live tenant; anything else = allowlist only"
    secret: false
    owner: operator
    scope: live
    description: "When exactly '1', EO's scheduler collects from every registered live tenant; otherwise it collects sim tenants, live tenants on the allowlist, and tenants with a connected operator session."
    source: "ces-eo/src/eo/server/EoServer.ts:317"
  - name: CES_EO_COLLECT_TENANTS
    component: [ces-eo]
    required: false
    default: "unset = all registered tenants (live ones still gated by CES_EO_COLLECT_LIVE)"
    allowed: "comma-separated tenant slugs"
    secret: false
    owner: operator
    scope: all
    description: "Comma-separated allowlist of tenant slugs EO's collection scheduler may collect from."
    source: "ces-eo/src/eo/collect/collectionScheduler.ts:99"
  - name: CES_EO_COLLECT_TICK_MIN
    component: [ces-eo]
    required: false
    default: "15"
    allowed: "a number of minutes >= 0 (floor 1 second)"
    secret: false
    owner: operator
    scope: all
    description: "Minutes between EO collection-scheduler ticks after the first."
    source: "ces-eo/src/eo/collect/collectionScheduler.ts:98"
  - name: CES_EO_OPERATOR_AUDIENCE
    component: [ces-eo]
    required: false
    default: "unset = audience not checked"
    allowed: "any string"
    secret: false
    owner: contractor
    scope: dev
    description: "Optional 'aud' claim EO requires on dev HS256 operator tokens (those signed with CES_EO_OPERATOR_SECRET under CES_EO_OPERATOR_DEV_FALLBACK=1)."
    source: "ces-eo/src/eo/approver-tokens/ApproverTokenIssuer.ts:131"
  - name: CES_EO_OPERATOR_DEV_FALLBACK
    component: [ces-eo]
    required: false
    default: "unset = off"
