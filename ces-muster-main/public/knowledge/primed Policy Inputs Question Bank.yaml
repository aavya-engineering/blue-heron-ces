schema_version: '1.0'
module: Policy_Inputs
purpose: Collect organization metadata, key personnel, org-defined parameters (ODPs), governance settings, and physical security details needed to auto-generate assessment-ready CMMC policy documents.
metadata:
  created_utc: '2026-03-03T00:00:00Z'
  owner: CES
  notes: Questions across 5 sections. Each question has bindings.policy_inputs mapping to PolicyInputsOutput paths.
sections:
- id: PI-01
  name: Organization Metadata
  questions:
  - id: PI.ORG.001
    section: Organization Metadata
    prompt: What is the organization's full legal name?
    answer_type: text
    options: []
    required: true
    help: The name as it appears on official contracts, SAM.gov registration, and CAGE code records.
    roles:
      primary_respondents:
      - Executive Sponsor
      validators:
      - Compliance Officer
    bindings:
      policy_inputs: organization.legal_name
    risk_flags: []
  - id: PI.ORG.002
    section: Organization Metadata
    prompt: What is the organization's street address?
    answer_type: text
    options: []
    required: true
    help: Primary business address used for official correspondence.
    roles:
      primary_respondents:
      - Executive Sponsor
      validators:
      - Facilities Manager
    bindings:
      policy_inputs: organization.address.street
    risk_flags: []
  - id: PI.ORG.003
    section: Organization Metadata
    prompt: City
    answer_type: text
    options: []
    required: true
    help: ''
    roles:
      primary_respondents:
      - Executive Sponsor
      validators: []
    bindings:
      policy_inputs: organization.address.city
    risk_flags: []
  - id: PI.ORG.004
    section: Organization Metadata
    prompt: State
    answer_type: text
    options: []
    required: true
    help: Two-letter state abbreviation (e.g., VA, MD, TX).
    roles:
      primary_respondents:
      - Executive Sponsor
      validators: []
    bindings:
      policy_inputs: organization.address.state
    risk_flags: []
  - id: PI.ORG.005
    section: Organization Metadata
    prompt: ZIP Code
    answer_type: text
    options: []
    required: true
    help: ''
    roles:
      primary_respondents:
      - Executive Sponsor
      validators: []
    bindings:
      policy_inputs: organization.address.zip
    risk_flags: []
  - id: PI.ORG.006
    section: Organization Metadata
    prompt: What is the organization's CAGE code?
    answer_type: text
    options: []
    required: false
    help: 5-character alphanumeric code assigned by DLA. Found on SAM.gov.
    roles:
      primary_respondents:
      - Contracts Manager
      validators:
      - Compliance Officer
    bindings:
      policy_inputs: organization.cage_code
    risk_flags: []
  - id: PI.ORG.007
    section: Organization Metadata
    prompt: What is the organization's DUNS/UEI number?
    answer_type: text
    options: []
    required: false
    help: Unique Entity Identifier (UEI) from SAM.gov, replacing legacy DUNS.
    roles:
      primary_respondents:
      - Contracts Manager
      validators: []
    bindings:
      policy_inputs: organization.duns_number
    risk_flags: []
  - id: PI.ORG.008
    section: Organization Metadata
    prompt: What is the organization's relationship to DoD contracts?
    answer_type: single_select
    options:
    - Prime Contractor
    - Subcontractor
    - Vendor / Supplier
    - Other
    required: true
    help: Determines the applicable flow-down requirements and policy language.
    roles:
      primary_respondents:
      - Executive Sponsor
      validators:
      - Contracts Manager
    bindings:
      policy_inputs: organization.org_type
    risk_flags: []
  - id: PI.ORG.009
    section: Organization Metadata
    prompt: What industry does the organization operate in?
    answer_type: text
    options: []
    required: false
    help: E.g., Aerospace & Defense, IT Services, Manufacturing, Engineering.
    roles:
      primary_respondents:
      - Executive Sponsor
      validators: []
    bindings:
      policy_inputs: organization.industry
    risk_flags: []
  - id: PI.ORG.010
    section: Organization Metadata
    prompt: What is the organization's primary NAICS code?
    answer_type: text
    options: []
    required: false
    help: 6-digit NAICS code (e.g., 541512 for Computer Systems Design Services).
    roles:
      primary_respondents:
      - Contracts Manager
      validators: []
    bindings:
      policy_inputs: organization.naics_code
    risk_flags: []
  - id: PI.ORG.011
    section: Organization Metadata
    prompt: Does this organization have a parent company? If so, what is the name?
    answer_type: text
    options: []
    required: false
    help: Leave blank if the organization is independent.
    roles:
      primary_respondents:
      - Executive Sponsor
      validators: []
    bindings:
      policy_inputs: organization.parent_company
    risk_flags: []

- id: PI-02
  name: Key Personnel
  questions:
  - id: PI.PER.001
    section: Key Personnel
    prompt: "Who is the Information System Security Officer (ISSO)? Provide: Name, Title, Email"
    answer_type: text
    options: []
    required: true
    help: "The ISSO is responsible for maintaining the security posture of the information system. Format: Name | Title | email@domain.com"
    roles:
      primary_respondents:
      - ISSO
      - IT Director
      validators:
      - Executive Sponsor
    bindings:
      policy_inputs: personnel.isso
    risk_flags: []
  - id: PI.PER.002
    section: Key Personnel
    prompt: "Who is the System Owner? Provide: Name, Title, Email"
    answer_type: text
    options: []
    required: true
    help: "The individual responsible for the operation and maintenance of the information system. Format: Name | Title | email@domain.com"
    roles:
      primary_respondents:
      - IT Director
      validators:
      - Executive Sponsor
    bindings:
      policy_inputs: personnel.system_owner
    risk_flags: []
  - id: PI.PER.003
    section: Key Personnel
    prompt: "Who is the Compliance Officer? Provide: Name, Title, Email"
    answer_type: text
    options: []
    required: true
    help: "The individual responsible for ensuring regulatory compliance. Format: Name | Title | email@domain.com"
    roles:
      primary_respondents:
      - Compliance Officer
      validators:
      - Executive Sponsor
    bindings:
      policy_inputs: personnel.compliance_officer
    risk_flags: []
  - id: PI.PER.004
    section: Key Personnel
    prompt: "Who is the IT Director / CTO? Provide: Name, Title, Email"
    answer_type: text
    options: []
    required: true
    help: "The senior technology leader. Format: Name | Title | email@domain.com"
    roles:
      primary_respondents:
      - IT Director
      validators:
      - Executive Sponsor
    bindings:
      policy_inputs: personnel.it_director
    risk_flags: []
  - id: PI.PER.005
    section: Key Personnel
    prompt: "Who is the HR representative for security awareness training? Provide: Name, Title, Email"
    answer_type: text
    options: []
    required: false
    help: "The HR contact responsible for coordinating security awareness training. Format: Name | Title | email@domain.com"
    roles:
      primary_respondents:
      - HR Manager
      validators: []
