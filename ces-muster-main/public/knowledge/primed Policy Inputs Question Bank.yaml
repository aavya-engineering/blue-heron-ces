  - id: PI.PER.006
    section: Key Personnel
    prompt: "Who is the Incident Response Lead? Provide: Name, Title, Email"
    answer_type: text
    options: []
    required: true
    help: "The individual who leads incident response activities. Format: Name | Title | email@domain.com"
    roles:
      primary_respondents:
      - ISSO
