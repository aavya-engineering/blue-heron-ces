  mpt_readiness_gates:
    description: Readiness gates computed from RR outputs to determine Mission Plan feasibility and sequencing.
    checks:
    - id: GATE-BOUNDARY-DEFINED
      name: Boundary defined and scoped
      requires_rrt_fields:
      - rrt.scope.boundary_defined
      - rrt.scope.asset_inventory_complete
      - rrt.scope.data_flows_documented
      pass_condition: All required scope fields are present and validated.
      failure_impact: Mission Plan cannot be generated reliably; scope must be corrected first.
    - id: GATE-SSP-BASELINE
      name: SSP baseline established
      requires_rrt_fields:
      - rrt.governance.ssp_exists
      pass_condition: SSP exists or a committed plan to draft SSP is captured as a gated early action.
      failure_impact: Assessment artifacts will be incomplete; SSP must be created/updated early in execution.
  rrt_outputs_for_mpt:
  - rrt.scope.*
  - rrt.governance.*
  - rrt.practice.*.status
  - rrt.practice.*.evidence
  - rrt.practice.*.notes
applicability_engine:
  description: Boolean evaluation model used by SIT to filter RR activities based on locked SI Baseline and scoping facts.
  supported_operators:
  - any
  - all
  - not
  - equals_any
  - contains_any
  - exists
  boolean_structure: conditions are nested boolean blocks of atoms; each atom evaluates a field against a predicate.
  evaluation_notes: Activities may include optional conditional_run_if blocks in future iterations; this generation emits universally applicable
    activities and relies on SIT filtering at runtime.
