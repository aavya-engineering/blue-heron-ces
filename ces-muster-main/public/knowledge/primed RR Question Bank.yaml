  activity_bank:
    universal:
      description: Universal RR foundation activities required to establish scoping and interpret practice results.
      activities:
      - id: RR-ACT-UNIV-BOUNDARY
        name: Define assessment boundary and in-scope assets
        applies_to_levels:
        - L1
        - L2
        - L3
        produces_rrt_fields:
        - rrt.scope.boundary_defined
        - rrt.scope.asset_inventory_complete
        validates_sit_its_fields:
          confirms: []
          may_contradict: []
        provenance:
          primary: government
          reference_sources:
          - src-dod-cmmc-model-v2
        advisor_description: Establish the authoritative boundary of the CUI/FCI environment, including CUI assets, security protection assets,
          specialized assets, and external service providers.
        advisor_reason_rrt: These foundation facts are required to scope the assessment and interpret practice implementation correctly.
        advisor_cmmc_impact: Incorrect scoping or boundary definition leads to failed assessments and rework.
        steps:
        - Interview stakeholders to confirm boundary and business processes.
        - Examine inventories, diagrams, and system records for completeness.
        - Record and validate the boundary and data flows against evidence.
        evidence_requests:
        - id: EV-RR-ACT-UNIV-BOUNDARY-01
          evidence_type: emx-boundary-001
          description: Provide the primary artifact supporting this foundation activity.
          acceptable_forms:
          - Inventory export
          - Boundary diagram
          - SSP excerpt
          - Data flow diagram
          collection_method: Export or authoritative document; avoid ad-hoc screenshots where possible.
          retention_notes: Retain as baseline evidence; update on material changes.
          cmmc_attainment_impact: Foundation evidence supporting scoping and assessment defensibility.
          advisor_notes: Ensure artifacts are time-bounded and reflect current state.
        outputs:
        - Populate rrt.scope.boundary_defined
        - Populate rrt.scope.asset_inventory_complete
        mapped_requirements:
        - FOUNDATION
        expected_evidence_archetypes:
