artifact: ces_evidence_archetype_catalog
version: 0.1.0
generated_on: 2026-02-03
intent: >-
  Canonical evidence archetypes for CES RR expected_evidence_archetypes references
  (vendor-neutral, assessor-aligned).
id_format: "EMX-<DOMAIN>-<NNN>"
domains:
  - BOUNDARY
  - DATAFLOW
  - IAM
  - ENDPOINT
  - CONFIG
  - LOG
  - VULN
  - RISK
  - IR
  - MEDIA
  - SUPPLIER
  - TRAINING
  - DEVOPS
evidence_archetypes:
  - archetype_id: EMX-BOUNDARY-001
    domain: BOUNDARY
    name: Assessment boundary statement
    description: Formal narrative defining the assessment/enclave boundary, inclusions/exclusions, and rationale.
    assessor_methods_expected: [examine, interview]
    acceptable_forms_examples:
      - Boundary statement document (PDF/Word)
      - Scope memo / charter
      - SSP boundary section excerpt
    collection_notes: >-
      Confirm boundary aligns with contract/flowdowns and matches diagrams/inventories; verify exclusions are justified and controlled.
    retention_notes_template: >-
      Retain current version and prior version for change history; store approvals/sign-off records.
    maps_to_cmmc_practices: []

  - archetype_id: EMX-BOUNDARY-002
    domain: BOUNDARY
    name: Network boundary diagram
    description: Diagram showing logical network segmentation, ingress/egress points, and boundary controls.
    assessor_methods_expected: [examine]
    acceptable_forms_examples:
      - Network diagram (Visio/PDF)
      - Cloud network topology export screenshot
    collection_notes: >-
      Diagram should match actual configs (firewall/VNet/subnet rules) and reference where CUI traverses/terminates.
    retention_notes_template: >-
      Retain diagram and source file; retain change log / approval ticket.
    maps_to_cmmc_practices: []

  - archetype_id: EMX-BOUNDARY-003
    domain: BOUNDARY
    name: In-scope asset inventory
    description: Authoritative list of in-scope endpoints, servers, cloud services, and network components.
    assessor_methods_expected: [examine, test]
    acceptable_forms_examples:
      - CMDB export
      - MDM/Intune device inventory export
      - Cloud resource inventory export
    collection_notes: >-
      Inventory must be current and reconcilable to management tooling; sample a subset for existence and ownership.
    retention_notes_template: >-
      Retain monthly snapshots for trending; retain inventory generation procedure.
    maps_to_cmmc_practices: []

  - archetype_id: EMX-BOUNDARY-004
    domain: BOUNDARY
    name: Interconnection / boundary agreements
    description: Documentation of interconnections and shared responsibility across connected networks/tenants.
    assessor_methods_expected: [examine]
    acceptable_forms_examples:
      - Interconnection agreement
      - Shared responsibility matrix excerpt
      - External connectivity register
    collection_notes: >-
      Clarify where controls are inherited vs customer-responsible; ensure agreements match actual integrations.
    retention_notes_template: >-
      Retain executed agreements and updates per audit window.
    maps_to_cmmc_practices:
      - CA.L2-3.12.1

  - archetype_id: EMX-DATAFLOW-001
    domain: DATAFLOW
    name: CUI data flow diagram
    description: Diagram depicting where CUI is created, stored, processed, and transmitted across systems and users.
    assessor_methods_expected: [examine, interview]
    acceptable_forms_examples:
      - Data flow diagram (Visio/PDF)
      - System context diagram
    collection_notes: >-
      Validate against actual workflows (Teams/SharePoint/repos/email); ensure boundary endpoints are explicit.
    retention_notes_template: >-
      Retain diagram and references used; update on material workflow changes.
    maps_to_cmmc_practices: []

  - archetype_id: EMX-DATAFLOW-002
    domain: DATAFLOW
    name: CUI location register
    description: Register of systems/locations where CUI may reside, with handling rules per location.
    assessor_methods_expected: [examine]
    acceptable_forms_examples:
      - CUI register spreadsheet
      - SharePoint list export
      - Data classification inventory export
    collection_notes: >-
      Include storage locations, access model, encryption state, sharing constraints, and owner.
    retention_notes_template: >-
      Retain current register and change history; ensure updates are controlled.
    maps_to_cmmc_practices: []

  - archetype_id: EMX-DATAFLOW-003
    domain: DATAFLOW
