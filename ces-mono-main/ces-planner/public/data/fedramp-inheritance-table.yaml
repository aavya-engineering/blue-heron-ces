# FedRAMP CSP Inheritance Table
# Controls that may be classified as Inherited-FedRAMP when the SI baseline
# declares cloud-only posture with valid FedRAMP package IDs.
#
# requires_fields: per-control conditions on SIBaseline.dependencies fields.
#   - physical_facility_count_zero: deps.physical_facility_count must be 0
#   - customer_equipment_count_zero: deps.customer_equipment_count must be 0
#   - Empty array: no infrastructure gate beyond cloud_only + package IDs.

metadata:
  version: "1.0.0"
  description: "FedRAMP inheritance eligibility for cloud-only CMMC L2 assessments"

controls:
  - control_id: PE.L1-3.10.1
    domain: PE
    title: Limit Physical Access
    requires_fields: [physical_facility_count_zero]
    tenant_variants: [gcc, gcc_high, dod_il5]
    rationale: "Physical access controls inherited from FedRAMP-authorized CSP when organization operates zero physical facilities."

  - control_id: PE.L2-3.10.2
    domain: PE
