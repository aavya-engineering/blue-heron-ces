  - "IA.L2-3.5.9"  # [VERIFY] mapping not yet confirmed
  - "IA.L2-3.5.10"  # [VERIFY] mapping not yet confirmed
practiceStatement: See CMMC 2.0 Assessment Guide for full practice statement.
useCaseId: C-09
useCaseTitle: "Password Policy Compliance"
domain: Credential & Secret Management
priority: P3 Medium
trigger: 'SCHEDULE: Monthly audit; or CHANGE: After password policy modification'
sodTier: Tier 2 (Config Manager)
entraRolesRequired:
- Authentication Policy Administrator
- Security Reader
approvalRequired: true
services:
- name: Entra ID Authentication Methods Policy
  purpose: ''
- name: Entra ID Password Protection
  purpose: custom banned password list
- name: Entra ID Smart Lockout
  purpose: ''
- name: Microsoft Sentinel
  purpose: lockout event monitoring
- name: Entra ID Sign-In Logs
  purpose: lockout correlation
configurationSteps:
  portalPath: //entra.microsoft.us > Protection > Authentication methods > Password protection.
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes Policy.ReadWrite.AuthenticationMethod, Policy.Read.All
  - cmdlet: Get-MgUser
    parameters:
    - -MgUser
    - -All
    - -Property
    - -Date
  graphApiEndpoint: GET https://graph.microsoft.us/beta/policies/authenticationMethodsPolicy
  graphApiPayloadExample: {}
  requiredPermissions:
  - Policy.Read.All
  - User.Read.All
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-c-credential/C-09/2026/03/
  format: 'CSV (columns: UPN, DisplayName, PasswordPolicy, LastPasswordChange, DaysSinceChange, OverMaxAge) plus JSON export
    of password protection and Smart Lockout settings'
  filenamePattern: C-09_PasswordPolicyCompliance_{YYYYMMDD}_{HHmmss}_MonthlyAudit.csv
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://entra.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: Entra ID Password Protection (custom banned password list and Smart Lockout) is available in GCC High. The custom
    banned password list supports up to 1,000 entries. Smart Lockout uses the familiar lockout and familiar location heuristics
    identically to commercial cloud. The minimum password length configuration at the tenant level may require the beta endpoint
    in GCC High -- verify the setting availability at `https://entra.microsoft.us` > Protection > Authentication methods >
    Password protection. If the 14-character minimum cannot be set at the Entra level, enforce via Intune device complianc
relatedPolicies: []
odpValues: []
dependencies:
  hardDependencies: []
  softDependencies: []
notes: ''
