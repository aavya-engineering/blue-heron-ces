    GCC High OneDrive/SharePoint. Ensure the exercise scenario document and all artifacts are stored in SharePoint Online
    GCC High (`.sharepoint.us`), not in personal cloud storage or commercial SharePoint. If the exercise involves demonstrating
    Sentinel capabilities, all Sentinel portal interactions use `https://portal.azure.us`. The CMMC Assessment Guide v2.0
    requires that the IR plan testing evidence demonstrate that the organization has tested its incident response plan. The
