controlId: "IA.L2-3.5.10"
relatedControlIds:
  - "IA.L1-3.5.2"
  - "SC.L2-3.13.10"  # [VERIFY] mapping not yet confirmed
practiceStatement: See CMMC 2.0 Assessment Guide for full practice statement.
useCaseId: C-01
useCaseTitle: "App Secret/Cert Expiry Alert"
domain: Credential & Secret Management
priority: P1 Critical
trigger: 'SCHEDULE: Weekly automated scan (every Monday 06:00 UTC)'
sodTier: Tier 1 (Read-Only Audit)
entraRolesRequired:
- Security Reader
- Reports Reader
approvalRequired: false
services:
- name: Entra ID Application Registrations
  purpose: ''
- name: Microsoft Graph API
  purpose: Application resource type
- name: Microsoft Sentinel
  purpose: Analytics Rules, Log Analytics workspace
- name: Azure Key Vault
  purpose: for certificate metadata, read-only access
configurationSteps:
  portalPath: //entra.microsoft.us > Applications > App registrations > All applications.
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes Application.Read.All
  - cmdlet: Get-MgApplication
    parameters:
    - -MgApplication
    - -All
    - -Property
    - -Date
    - -le
  graphApiEndpoint: GET https://graph.microsoft.us/v1.0/applications?$select=id,displayName,appId,passwordCredentials,keyCredentials
  graphApiPayloadExample: {}
  requiredPermissions:
  - Application.Read.All (application)
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-c-credential/C-01/2026/03/
  format: 'CSV (columns: AppName, AppId, CredentialType, KeyId, ExpiryDate, DaysRemaining, Severity)'
  filenamePattern: C-01_AppCredentialExpiry_{YYYYMMDD}_{HHmmss}_WeeklyScan.csv
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://portal.azure.us
  - https://graph.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: All endpoints use GCC High URIs. The `Get-MgApplication` cmdlet with `-Environment USGov` correctly targets `graph.microsoft.us`.
    Sentinel analytics rules in Azure Government function identically to commercial. Ensure the Log Analytics workspace is
    in a `USGov` region. The Sentinel watchlist feature referenced in the KQL query is available in Azure Government.
relatedPolicies: []
odpValues: []
dependencies:
  hardDependencies: []
  softDependencies: []
notes: ''
