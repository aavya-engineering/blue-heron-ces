controlId: "IA.L2-3.5.10"
relatedControlIds:
  - "IA.L1-3.5.2"
  - "IA.L2-3.5.7"  # [VERIFY] mapping not yet confirmed
  - "IA.L2-3.5.8"  # [VERIFY] mapping not yet confirmed
practiceStatement: See CMMC 2.0 Assessment Guide for full practice statement.
useCaseId: C-06
useCaseTitle: "Service Account Password Rotation"
domain: Credential & Secret Management
priority: P4 Standard
trigger: 'SCHEDULE: Every 90 days; or INCIDENT: Service account compromise indicator'
sodTier: Tier 2 (Config Manager)
entraRolesRequired:
- User Administrator (for Entra-managed service accounts)
- Key Vault Secrets Officer (for vault-stored passwords)
approvalRequired: true
services:
- name: Entra ID
  purpose: service account user objects
- name: Azure Key Vault
  purpose: secret storage for rotated passwords
- name: Microsoft Sentinel
  purpose: service account sign-in monitoring
- name: ITSM system
  purpose: change ticket for rotation events
configurationSteps:
  portalPath: //entra.microsoft.us > Users > filter by account type or naming convention (e.g., svc-* prefix).
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes User.ReadWrite.All
  - cmdlet: Update-MgUser
    parameters:
    - -MgUser
    - -UserId
    - -PasswordProfile
    - -name
    - -vault
  graphApiEndpoint: PATCH https://graph.microsoft.us/v1.0/users/{serviceAccountId}
  graphApiPayloadExample: {}
  requiredPermissions:
  - User.ReadWrite.All (application)
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-c-credential/C-06/2026/03/
  format: 'JSON (fields: ServiceAccountUPN, RotationDate, NextRotationDue, VaultSecretName, PasswordLength, Method)'
  filenamePattern: C-06_ServiceAccountRotation_{YYYYMMDD}_{HHmmss}_{ServiceAccountUPN}.json
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://portal.azure.us
  - https://graph.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: The `login.microsoftonline.us` endpoint must be used for ROPC (Resource Owner Password Credential) verification flows.
    Note that ROPC is used here strictly for post-rotation verification and should not be a normal authentication pattern.
    The Key Vault endpoint for secret storage is `https://{vault-name}.vault.usgovcloudapi.net`. Managed identities (C-07)
    should be the long-term target for all service accounts; password rotation is the interim control.
relatedPolicies: []
odpValues: []
dependencies:
  hardDependencies: []
  softDependencies: []
notes: ''
