  filenamePattern: E-05_AlertFatigueAnalysis_{YYYYMMDD}_{HHmmss}_FPRateReport.csv
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://portal.azure.us
  - https://graph.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: |-
    - Sentinel automation rules are fully available in Azure Government. The SOAR (Security Orchestration, Automation, and Response) engine operates identically to commercial.
    - Built-in Sentinel workbooks for alert efficiency may require manual import in GCC High if they are not pre-loaded in the content hub. Export the workbook JSON from a reference environment and import via the Azure portal.
    - Security Copilot-assisted tuning recommendations are not available in GCC High. All tuning decisions must be manual, based on KQL analysis of incident classification data.
