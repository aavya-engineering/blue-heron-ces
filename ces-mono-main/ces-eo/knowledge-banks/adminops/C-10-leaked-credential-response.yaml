controlId: "SI.L1-3.14.2"
relatedControlIds:
  - "IA.L1-3.5.2"
  - "IR.L2-3.6.1"  # [VERIFY] mapping not yet confirmed
  - "IR.L2-3.6.2"  # [VERIFY] mapping not yet confirmed
practiceStatement: See CMMC 2.0 Assessment Guide for full practice statement.
useCaseId: C-10
useCaseTitle: "Leaked Credential Response"
domain: Credential & Secret Management
priority: P4 Standard
trigger: 'INCIDENT: Entra ID Protection detects leaked credentials; or ALERT: Sentinel rule for high-risk user detection'
sodTier: Tier 2 (Config Manager) for initial response; Tier 3 (Privileged Admin) if escalation to H-02 is required
entraRolesRequired:
- Security Administrator (Tier 2 for risk remediation); Global Administrator via PIM (Tier 3 if H-02 escalation)
approvalRequired: true
services:
- name: Entra ID Protection
  purpose: risk detections, risky users
- name: Entra ID
  purpose: user management, session revocation
- name: Microsoft Graph API
  purpose: Identity Protection endpoints
- name: Microsoft Sentinel
  purpose: risk detection alerting, investigation
- name: ITSM system
  purpose: incident ticket creation
configurationSteps:
  portalPath: //entra.microsoft.us > Protection > Identity Protection > Risky users.
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes IdentityRiskyUser.ReadWrite.All, User.ReadWrite.All, AuditLog.Read.All
  - cmdlet: Get-MgRiskyUser
    parameters:
    - -MgRiskyUser
    - -Filter
    - -All
    - -MgRiskyUserHistory
    - -RiskyUserId
  - cmdlet: Get-MgRiskyUserHistory
    parameters:
    - -MgRiskyUserHistory
    - -RiskyUserId
    - -Object
    - -eq
    - -or
  - cmdlet: Update-MgUser
    parameters:
    - -MgUser
    - -UserId
    - -PasswordProfile
    - -in
    - -MgAuditLogSignIn
  - cmdlet: Get-MgAuditLogSignIn
    parameters:
    - -MgAuditLogSignIn
    - -Filter
    - -Top
    - -Object
  graphApiEndpoint: GET https://graph.microsoft.us/v1.0/identityProtection/riskyUsers?$filter=riskLevel
  graphApiPayloadExample: {}
  requiredPermissions:
  - IdentityRiskyUser.ReadWrite.All
  - User.ReadWrite.All
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-c-credential/C-10/2026/03/
  format: 'JSON (fields: UserId, UserPrincipalName, RiskLevel, RiskState, DetectionTypes, ActionsTaken, RecentSignIns, EscalateToH02,
    Timestamp)'
  filenamePattern: C-10_LeakedCredResponse_{YYYYMMDD}_{HHmmss}_{UserUPN}.json
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://portal.azure.us
  - https://graph.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: Entra ID Protection is fully available in GCC High with the M365 G5 license. Risk detections, including leaked credentials,
    are processed using Microsoft's global threat intelligence feeds. The `identityProtection` API endpoints are available
    at `graph.microsoft.us`. The `Confirm-MgRiskyUserCompromised` and `Revoke-MgUserSignInSession` cmdlets work identically
    in GCC High when connected via `-Environment USGov`. Note that Sentinel integration with Identity Protection uses the
    `IdentityProtection` data connector, which must be enabled in the GCC High Sentinel workspace.
relatedPolicies: []
odpValues: []
dependencies:
  hardDependencies: []
  softDependencies: []
notes: ''
