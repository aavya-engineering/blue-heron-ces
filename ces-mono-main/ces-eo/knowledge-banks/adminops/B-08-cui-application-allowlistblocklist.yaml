useCaseId: B-08
useCaseTitle: "CUI App Allowlist/Blocklist"
domain: Device & Endpoint Management
priority: P3 Medium
trigger: 'CHANGE: New application deployed or discovered; ASSESSMENT: Quarterly application review'
sodTier: Tier 2 -- Config Manager
entraRolesRequired:
- Intune Administrator
- Security Administrator
approvalRequired: true
services:
- name: Windows Defender Application Control
  purpose: WDAC -- application whitelisting policies
- name: Microsoft Intune
  purpose: WDAC policy deployment via configuration profiles, App Protection Policies
- name: Microsoft Defender for Endpoint
  purpose: web content filtering, indicators of compromise for application blocking
- name: Entra ID
  purpose: device groups for policy targeting
configurationSteps:
  portalPath: https://intune.microsoft.us
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes DeviceManagementConfiguration.ReadWrite.All
  - cmdlet: New-MgDeviceManagementDeviceConfiguration
    parameters:
    - -MgDeviceManagementDeviceConfiguration
    - -BodyParameter
    - -MgDeviceManagementDeviceConfiguration
    - -Filter
    - -CUI
  - cmdlet: Get-MgDeviceManagementDeviceConfiguration
    parameters:
    - -MgDeviceManagementDeviceConfiguration
    - -Filter
    - -CUI
    - -Allowlist
    - -Object
  graphApiEndpoint: POST https://graph.microsoft.us/v1.0/deviceManagement/deviceConfigurations
  graphApiPayloadExample: {}
  requiredPermissions:
  - DeviceManagementConfiguration.ReadWrite.All
  - DeviceManagementConfiguration.Read.All
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-b-device/B-08/{year}/{month}/
  format: XML (WDAC policy export), JSON (App Protection Policy export, web filtering policy), PNG (portal configuration screenshots)
  filenamePattern: B-08_AppAllowlistPolicy_{YYYYMMDD}_{HHmmss}_{PolicyName}.xml
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://security.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
