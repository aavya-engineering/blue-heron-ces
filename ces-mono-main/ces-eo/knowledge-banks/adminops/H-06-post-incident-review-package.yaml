approvalRequired: true
services:
- name: Microsoft Sentinel
  purpose: Azure Government -- incident timeline data
- name: Microsoft Defender Portal
  purpose: '`https://security.microsoft.us` -- alert and investigation data'
- name: Entra ID Audit Logs
  purpose: '`https://entra.microsoft.us`'
- name: SharePoint Online
  purpose: GCC High -- for RCA document storage
- name: ITSM system
  purpose: for POA&M tracking
configurationSteps:
  portalPath: //security.microsoft.us > **Incidents** > select the closed incident
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes SecurityIncident.Read.All
  graphApiEndpoint: GET https://graph.microsoft.us/v1.0/security/incidents/{incidentId}
  graphApiPayloadExample: {}
  requiredPermissions: []
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-h-incident/H-06/{year}/{month}/
  format: JSON (all structured documents), PDF (CISO-signed RCA for formal record)
  filenamePattern: H-06_RCA_{YYYYMMDD}_{HHmmss}_{IncidentID}.json
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://graph.microsoft.us
  - https://security.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
