controlId: "AC.L2-3.1.3"
relatedControlIds:
  - "IA.L2-3.5.11"
  - "AC.L2-3.1.5"
  - "AC.L2-3.1.6"
  - "AC.L2-3.1.7"
  - "AC.L2-3.1.4"

practiceStatement: "Obscure feedback of authentication information during the authentication process."

useCaseId: "A-09"
useCaseTitle: "Privileged Role Review (PIM)"
domain: "Identity & Access Management"
priority: "P1 Critical"
trigger: "SCHEDULE: Quarterly (every 90 days)"

sodTier: "Tier 2 -- Config Manager"
entraRolesRequired:
  - "Privileged Role Administrator"
  - "Security Reader"

approvalRequired: false

services:
  - name: "Entra ID Access Reviews"
    purpose: "Review creation, scheduling, auto-removal"
  - name: "PIM"
    purpose: "Role eligibility is the review target"
  - name: "Microsoft Graph PowerShell"
    modules:
      - "Microsoft.Graph.Identity.Governance"

configurationSteps:
  portalPath: "https://entra.microsoft.us > Identity Governance > Access reviews > New access review"

  powershellCmdlets:
    - cmdlet: "Connect-MgGraph"
      parameters:
        - "-Environment USGov"
        - "-Scopes AccessReview.ReadWrite.All,RoleManagement.ReadWrite.Directory"
    - cmdlet: "New-MgIdentityGovernanceAccessReviewDefinition"
      parameters:
        - "-BodyParameter"

  graphApiEndpoint: "POST https://graph.microsoft.us/v1.0/identityGovernance/accessReviews/definitions"
  graphApiPayloadExample:
    displayName: "A-09: Quarterly Privileged Role Review - Q1 2026"
    descriptionForAdmins: "Quarterly review of all PIM-eligible privileged role assignments per CMMC AC.L2-3.1.5"
    scope:
      "@odata.type": "#microsoft.graph.principalResourceMembershipsScope"
      principalScopes:
        - "@odata.type": "#microsoft.graph.accessReviewQueryScope"
          query: "/roleManagement/directory/roleEligibilityScheduleInstances"
          queryType: "MicrosoftGraph"
      resourceScopes:
        - "@odata.type": "#microsoft.graph.accessReviewQueryScope"
          query: "/roleManagement/directory/roleDefinitions?$filter=isBuiltIn eq true"
          queryType: "MicrosoftGraph"
    reviewers:
      - query: "./manager"
        queryType: "MicrosoftGraph"
    settings:
      mailNotificationsEnabled: true
      reminderNotificationsEnabled: true
      justificationRequiredOnApproval: true
      defaultDecisionEnabled: true
      defaultDecision: "Deny"
      instanceDurationInDays: 14
      autoApplyDecisionsEnabled: true
      recurrence:
        pattern:
          type: "absoluteMonthly"
          interval: 3
        range:
          type: "noEnd"
          startDate: "2026-04-01"

  requiredPermissions:
    - "AccessReview.ReadWrite.All"

evidenceArtifacts:
  - type: "Azure AD Audit Logs"
    retentionPeriod: "7 years"
    storageLocation: "evidence-store/domain-a-identity/A-09/{year}/{month}/"
    query: "Activity: Create access review, Complete access review"
  - type: "Stamper Execution Evidence"
    hashAlgorithm: "SHA-256"
    storageLocation: "evidence-store/domain-a-identity/A-09/{year}/{month}/"
    format: "JSON (access review definition, review decisions, auto-apply results)"
    filenamePattern: "A-09_PrivRoleReview_{YYYYMMDD}_{HHmmss}_{Quarter}{Year}.json"

gccHighSpecifics:
  endpoints:
    - "https://graph.microsoft.us"
    - "https://entra.microsoft.us"
  complianceBoundary: "FedRAMP High + CMMC L2"
  endpointValidation: "All endpoints use .microsoft.us domains"
  notes: "Access reviews are fully available in GCC High with Entra ID P2. Auto-apply results work identically. If a reviewer does not respond within 14-day window, default decision (Deny / Remove access) is applied automatically."

relatedPolicies:
  - "AC-001 Access Control Policy"

odpValues: []

dependencies:
  hardDependencies:
    - useCaseId: "A-10"
      reason: "Standing privilege elimination must have converted permanent roles to PIM eligible; otherwise access reviews cannot target PIM roles"
  softDependencies:
    - useCaseId: "A-17"
      reason: "Admin account separation ensures reviewers are reviewing the correct accounts"
    - useCaseId: "E-09"
      reason: "Review results feed C3PAO evidence package"
    - useCaseId: "A-04"
      reason: "Role changes may trigger re-review"

notes: "Quarterly review of all PIM-eligible privileged roles. Reviewers are managers or designated security personnel. Auto-removes users who do not respond or whose reviewers deny continued access. Enforces least privilege by periodically verifying only justified users retain privileged role eligibility."
