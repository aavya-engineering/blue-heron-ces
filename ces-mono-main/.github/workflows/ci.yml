name: CI

# G6 safety net: run the full CES suite (1008 tests incl. the G3 golden SSP
# reference) on every push/PR. Offline only — no live-tenant, network, or mmdc
# steps (those stay manual). Reproduces the root `npm test` contract exactly.

on:
  push:
    branches: [master, g0-safety-net]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + full suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # matches local dev (v24.x); engines require >=18
          cache: 'npm'

      - name: Install (clean, from lockfile)
        run: npm ci

      # Supply-chain gate (G-ENG-3): fail the build on a HIGH/CRITICAL production
      # vulnerability. This is the recurrence guard for G-ENG-2 (the multer HIGH):
      # a future high-severity prod dep cannot ship unnoticed. `high` level lets the
      # deferred, non-applicable uuid MODERATE through (EO uses uuid.v4 only).
      - name: Dependency audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high

      # `npm test` runs the root contract: pretest builds ces-shared + ces-stamper,
      # then test:shared/stamper/eo/ao/fe (mixed vitest + jest). The eo suite
      # includes the golden SSP reference test. A failing test exits non-zero and
      # fails the job.
      - name: Build + test (full aggregate)
        run: npm test

  muster-api:
    name: muster-api tests
    # P2-03 fix: muster-api had 54 vitest files with no CI coverage. Recipe hash
    # drift (P1-01) and registry path issues (P1-03) were not caught automatically.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (workspace root)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            ces-muster-main/muster-api/package-lock.json
            ces-muster-main/package-lock.json

      # ces-stamper registry is expected at ../ces-stamper relative to workspace root
      # by muster-api tests (live.areas, live.gate, live.teams, live.azTranslate).
      - name: Create ces-stamper symlink (registry path tests)
        run: ln -s $GITHUB_WORKSPACE/ces-mono-main/ces-stamper $GITHUB_WORKSPACE/ces-stamper

      # ces-muster expected at ces-mono-main/ces-muster by stamper fixture tests
      - name: Create ces-muster symlink (stamper fixture tests)
        run: |
          cd ces-muster-main
          git init --initial-branch=main
          git add src/features/plan/__fixtures__/
          git -c user.email=ci@ces.local -c user.name=CI commit -m fixture-baseline
          cd ..
          ln -s $GITHUB_WORKSPACE/ces-muster-main $GITHUB_WORKSPACE/ces-mono-main/ces-muster

      - name: Install ces-shared deps + build
        working-directory: ces-mono-main/ces-shared
        run: npm ci && npm run build

      - name: Install ces-tenant deps + build
        working-directory: ces-tenant-main
        run: npm ci && npm run build || true

      - name: Install muster-api deps
        working-directory: ces-muster-main/muster-api
        run: npm ci

      - name: Dependency audit (prod, high+)
        working-directory: ces-muster-main/muster-api
        run: npm audit --omit=dev --audit-level=high

      - name: Test muster-api
        working-directory: ces-muster-main/muster-api
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          # No DATABASE_URL — RLS and delivery tests use in-memory mocks via vitest
