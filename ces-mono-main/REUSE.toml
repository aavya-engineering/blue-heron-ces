version = 1

# Files labelled here instead of carrying an in-file header:
# JSON, .psd1, Markdown, migrations, ces-eo templates, generated psmodules,
# fixtures/snapshots, binaries, dist/, dotfiles and other formats without comment syntax.
[[annotations]]
path = [
  "**/*.csv",
  "**/*.json",
  "**/*.md",
  "**/*.png",
  "**/*.svg",
  "**/*.txt",
  "**/__fixtures__/**",
  "**/fixtures/**",
  "**/public/**",
  "*.csv",
  "*.json",
  "*.md",
  "*.png",
  "*.svg",
  "*.txt",
  ".gitattributes",
  ".github/CODEOWNERS",
  ".github/workflows/ci.yml",
  ".gitignore",
  "__fixtures__/**",
  "ces-ao/.gitignore",
  "ces-ec/.gitignore",
  "ces-eo/.gitignore",
  "ces-eo/knowledge-banks/**",
  "ces-eo/src/**/*.hbs",
  "ces-planner/.gitignore",
  "ces-planner/.prettierrc",
  "ces-planner/data/**",
  "ces-stamper/.gitignore",
  "docs/product/**",
  "fixtures/**",
  "public/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Blue Heron Defense LLC and its licensors. All rights reserved."
SPDX-License-Identifier = "LicenseRef-BHD-Proprietary"
