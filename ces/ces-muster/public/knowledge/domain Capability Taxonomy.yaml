# CES Capability Taxonomy & Practice Mapping
# Maps CMMC practices to canonical security capabilities and implementation patterns.
# Used during Mission Plan generation to produce actionable, vendor-specific instructions.
#
# Each capability represents a functional security area that an organization implements
# using specific tools, configurations, and processes. Multiple CMMC domains map to
# the same capability (e.g., AC + IA both map to Identity & Access Management).

ces:
  artifact: capability_taxonomy
  version: "1.0.0"
  generated_on: "2026-02-07"

capabilities:

  # ---------------------------------------------------------------------------
  # 1. IDENTITY & ACCESS MANAGEMENT
  # Core identity lifecycle: user provisioning, authentication, authorization,
  # session management, privilege control.
  # ---------------------------------------------------------------------------
  - id: identity_access_management
    name: Identity & Access Management
    abbreviation: IAM
    description: >
      User identity lifecycle, authentication, authorization, session management,
      and privilege controls. Covers who can access what, how they prove identity,
      and how access is enforced and reviewed.
    cmmc_domains: [AC, IA]
    vendor_stack_components:
      microsoft_365: [Entra ID, Conditional Access, PIM, RBAC]
    practices:
      # -- Access Control (authorization, session, privilege) --
      - id: AC.L1-3.1.1
        title: Authorized Access Control
        capability_role: Restrict system access to authorized users
      - id: AC.L1-3.1.2
        title: Transaction & Function Control
        capability_role: Limit access to authorized transactions and functions
      - id: AC.L2-3.1.1
        title: Account Management
        capability_role: Manage user accounts and access lifecycle
      - id: AC.L2-3.1.2
        title: Privileged Access Control
        capability_role: Limit system access to authorized privileged users
      - id: AC.L2-3.1.4
        title: Separation of Duties
        capability_role: Separate duties to reduce risk of malicious activity
      - id: AC.L2-3.1.5
        title: Least Privilege
        capability_role: Employ principle of least privilege
      - id: AC.L2-3.1.6
        title: Non-Privileged Account Use
        capability_role: Use non-privileged accounts for non-security functions
      - id: AC.L2-3.1.7
        title: Privileged Functions
        capability_role: Prevent non-privileged users from executing privileged functions
      - id: AC.L2-3.1.8
        title: Unsuccessful Logon Attempts
        capability_role: Limit unsuccessful logon attempts
      - id: AC.L2-3.1.9
        title: System Use Notification
        capability_role: Provide privacy and security notices at logon
      - id: AC.L2-3.1.10
        title: Session Lock
        capability_role: Lock sessions after inactivity
      - id: AC.L2-3.1.11
        title: Session Termination
        capability_role: Terminate sessions after defined conditions
      - id: AC.L3-3.1.1e
        title: Dual Authorization
        capability_role: Require dual authorization for critical operations
      # -- Identification & Authentication --
      - id: IA.L1-3.5.1
        title: Identification
        capability_role: Identify system users and processes
      - id: IA.L1-3.5.2
        title: Authentication
        capability_role: Authenticate users and processes before access
      - id: IA.L2-3.5.1
        title: User Identification
        capability_role: Identify system users, processes, and devices
      - id: IA.L2-3.5.2
        title: Device Identification
        capability_role: Authenticate devices before connection
      - id: IA.L2-3.5.3
        title: Multifactor Authentication
        capability_role: Use MFA for local and network access
      - id: IA.L2-3.5.4
