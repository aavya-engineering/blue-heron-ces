        capability_role: Employ replay-resistant authentication
      - id: IA.L2-3.5.5
        title: Identifier Reuse Prevention
        capability_role: Prevent reuse of identifiers
      - id: IA.L2-3.5.6
        title: Identifier Disablement
        capability_role: Disable identifiers after inactivity period
      - id: IA.L2-3.5.7
        title: Password Complexity
        capability_role: Enforce minimum password complexity
      - id: IA.L2-3.5.8
        title: Password Reuse Prevention
        capability_role: Prohibit password reuse
      - id: IA.L2-3.5.9
        title: Temporary Passwords
        capability_role: Manage temporary password lifecycle
      - id: IA.L2-3.5.10
        title: Cryptographic Password Protection
        capability_role: Store and transmit only protected passwords
      - id: IA.L2-3.5.11
