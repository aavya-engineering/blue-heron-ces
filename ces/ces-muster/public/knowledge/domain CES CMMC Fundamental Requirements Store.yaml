  status_values:
  - MET
  - PARTIAL
  - NOT_MET
  - NOT_APPLICABLE
  - UNKNOWN
  scoping_categories:
  - id: cui_asset
    name: CUI asset
    definition: Asset that stores, processes, or transmits CUI.
    source_ids:
    - src-dod-cmmc-model-v2
    - src-nist-800-171r2
  - id: fci_asset
    name: FCI asset
    definition: Asset that stores, processes, or transmits Federal Contract Information (FCI) without CUI.
    source_ids:
    - src-far-52_204-21
    - src-dod-cmmc-model-v2
  - id: security_protection_asset
    name: Security protection asset
    definition: Asset that provides security services for in-scope assets (e.g., identity, logging, EDR, vulnerability scanning).
    source_ids:
    - src-dod-cmmc-model-v2
  - id: specialized_asset
    name: Specialized asset
    definition: Specialized assets (OT/IoT, lab/test equipment) that may require alternate implementation/compensating controls.
    source_ids:
    - src-dod-cmmc-model-v2
  - id: out_of_scope_asset
    name: Out of scope asset
    definition: Asset not in assessment scope (no CUI/FCI handling and not providing protection services).
    source_ids:
    - src-dod-cmmc-model-v2
  - id: external_service_provider
    name: External service provider
    definition: External provider used to store/process/transmit CUI/FCI or to provide security/protection services to the
      enclave.
    source_ids:
    - src-dod-cmmc-model-v2
  - id: enclave_boundary_control
    name: Enclave boundary control
    definition: Control/technology that enforces the enclave boundary (segmentation, gateways, CASB, etc.).
    source_ids:
    - src-dod-cmmc-model-v2
levels:
  L1:
    focus: Protect FCI using basic safeguarding practices aligned to FAR 52.204-21.
    baseline_sources:
    - src-far-52_204-21
    - src-dod-cmmc-ag-l1
    - src-dod-cmmc-model-v2
    assessment_routes:
    - self_assessment
    scoping_guidance_sources:
    - src-dod-cmmc-model-v2
    - src-far-52_204-21
    assessment_guidance_sources:
    - src-dod-cmmc-ag-l1
  L2:
    focus: Protect CUI using NIST SP 800-171 Rev. 2 security requirements (110).
    baseline_sources:
    - src-nist-800-171r2
    - src-dod-cmmc-ag-l2
    - src-dod-cmmc-model-v2
    assessment_routes:
    - self_assessment
    - c3pao_assessment
    scoping_guidance_sources:
    - src-dod-cmmc-model-v2
    - src-nist-800-171r2
    assessment_guidance_sources:
    - src-dod-cmmc-ag-l2
  L3:
    focus: Enhanced protections for critical programs/high value assets; derived from NIST SP 800-172 enhanced requirements
      (35), mapped per CES with explicit tagging.
    baseline_sources:
    - src-nist-800-172
    - src-nist-800-171r2
    - src-dod-cmmc-model-v2
    assessment_routes:
    - government_assessment
    scoping_guidance_sources:
    - src-dod-cmmc-model-v2
    - src-nist-800-172
    assessment_guidance_sources:
    - src-nist-800-172a
requirements:
- requirement_id: AC.L1-3.1.1
  level: L1
  domain: AC
  title: Authorized
  requirement_text: Limit system access to Account Management User registration and authorized users, processes de-registration
    acting on behalf of authorized User access users, and devices (including provisioning other systems).
  references:
    cmmc_practice_id: AC.L1-3.1.1
    nist_800_171_id: 3.1.1
    far_clause_52_204_21_id: 52.204-21
    other:
    - FAR 52.204-21 basic safeguarding
  assessment_objectives:
  - id: AO-AC.L1-3.1.1-EXAM
    text: Examine evidence demonstrating AC.L1-3.1.1 is implemented and enforced for the in-scope boundary.
    methods:
    - examine
    evidence_archetypes:
    - emx-iam-005
    - emx-iam-004
    - emx-iam-001
    source_ids:
    - src-dod-cmmc-ag-l1
    - src-far-52_204-21
    - src-dod-cmmc-model-v2
    - src-nist-800-171r2
  - id: AO-AC.L1-3.1.1-INT
    text: Interview responsible personnel to validate procedures supporting AC.L1-3.1.1 are consistently followed.
    methods:
    - interview
    evidence_archetypes:
    - emx-iam-005
    - emx-iam-004
    source_ids:
    - src-dod-cmmc-ag-l1
    - src-far-52_204-21
    - src-dod-cmmc-model-v2
    - src-nist-800-171r2
  design_for_assessment:
  - id: DFC-AC.L1-3.1.1-001
    title: Design for auditability
    constraint: Implement the control so evidence can be produced on demand (policy + configuration export + operational logs)
      without manual reconstruction.
    verification: Verify evidence can be generated within one business day and is time-bounded to the assessment period.
    evidence_archetypes:
    - emx-iam-005
    - emx-iam-004
    - emx-iam-001
  scoping_impacts:
  - id: SR-CUI-001
    summary: In scope when the component stores/processes/transmits CUI or provides the processing environment for CUI workflows.
    in_scope_when:
      any:
      - field: asset_handles_cui
        equals_any:
        - true
      - field: data_types
        equals_any:
        - CUI
    affected_scoping_categories:
    - cui_asset
    design_implications:
    - Treat the component as part of the CUI enclave boundary and include it in SSP, inventories, and evidence collection.
    source_ids:
    - src-dod-cmmc-ag-l1
    - src-far-52_204-21
    - src-dod-cmmc-model-v2
    - src-nist-800-171r2
  - id: SR-SPA-001
    summary: In scope when the component provides security functions protecting CUI assets (identity, logging, EDR, scanning,
      network controls).
    in_scope_when:
      any:
      - field: is_security_service
        equals_any:
        - true
      - field: protects_cui_assets
        equals_any:
        - true
      - field: asset_role
        equals_any:
        - security_protection_asset
    affected_scoping_categories:
    - security_protection_asset
    design_implications:
    - Include as security protection asset; evidence must demonstrate continuous effectiveness and administrator access controls.
    source_ids:
    - src-dod-cmmc-ag-l1
    - src-far-52_204-21
