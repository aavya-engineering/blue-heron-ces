      touch CUI or provide protection.
    in_scope_when:
      any:
      - field: is_specialized_asset
        equals_any:
        - true
      - field: asset_type
        equals_any:
        - OT
        - IoT
        - lab_equipment
        - test_equipment
    affected_scoping_categories:
    - specialized_asset
    design_implications:
    - Define compensating controls, segmentation, and monitoring expectations; justify limitations in SSP.
    source_ids:
    - src-nist-800-172
    - src-nist-800-172a
    - src-dod-cmmc-model-v2
  evidence_minimum:
    must_have:
    - emx-vuln-001
    - emx-vuln-002
    nice_to_have:
    - emx-vuln-003
    - emx-endpoint-005
  operationalization_notes: '- Prefer tenant-wide controls.

    - Document deviations and compensating controls with rationale.

    - Use repeatable exports/logs instead of one-off screenshots.'
  common_pitfalls:
  - Policies exist but are not enforced by configuration.
  - Evidence is ad-hoc (screenshots) instead of repeatable exports/logs.
  - Scope boundaries exclude systems that still touch CUI workflows.
  ui_help:
    advisor_description: Capture what is implemented, where it is enforced, and how it is evidenced. Prefer exports and logs
      over screenshots.
    why_it_matters: This practice reduces risk to CUI/FCI by ensuring consistent control operation and auditability.
    attainment_impact: Accurate answers drive correct RR scoping and prevent rework during Mission Plan execution.
  tag: INFERENCE
  source_ids:
  - src-nist-800-172
  - src-nist-800-172a
  - src-dod-cmmc-model-v2
