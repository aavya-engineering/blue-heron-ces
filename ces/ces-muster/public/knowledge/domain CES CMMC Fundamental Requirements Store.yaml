  requirement_text: Develop, document, and periodically update system security plans that describe system boundaries, system
    environments of operation, how security requirements are implemented, and the relationships with or connections to other
    systems.
  references:
    cmmc_practice_id: CA.L2-3.12.4
    nist_800_171_id: 3.12.4
  assessment_objectives:
  - id: AO-CA.L2-3.12.4-EXAM
    text: Examine evidence demonstrating CA.L2-3.12.4 is implemented and enforced for the in-scope boundary.
    methods:
    - examine
    evidence_archetypes:
    - emx-risk-001
    - emx-risk-002
    - emx-log-003
    source_ids:
    - src-dod-cmmc-ag-l2
    - src-nist-800-171r2
    - src-dod-cmmc-model-v2
  - id: AO-CA.L2-3.12.4-INT
    text: Interview responsible personnel to validate procedures supporting CA.L2-3.12.4 are consistently followed.
    methods:
    - interview
    evidence_archetypes:
    - emx-risk-001
    - emx-risk-002
    source_ids:
    - src-dod-cmmc-ag-l2
    - src-nist-800-171r2
    - src-dod-cmmc-model-v2
  design_for_assessment:
  - id: DFC-CA.L2-3.12.4-001
    title: Design for auditability
    constraint: Implement the control so evidence can be produced on demand (policy + configuration export + operational logs)
      without manual reconstruction.
    verification: Verify evidence can be generated within one business day and is time-bounded to the assessment period.
    evidence_archetypes:
    - emx-risk-001
    - emx-risk-002
    - emx-log-003
  scoping_impacts:
  - id: SR-CUI-001
    summary: In scope when the component stores/processes/transmits CUI or provides the processing environment for CUI workflows.
    in_scope_when:
      any:
      - field: asset_handles_cui
        equals_any:
        - true
      - field: data_types
        equals_any:
        - CUI
    affected_scoping_categories:
    - cui_asset
    design_implications:
    - Treat the component as part of the CUI enclave boundary and include it in SSP, inventories, and evidence collection.
    source_ids:
    - src-dod-cmmc-ag-l2
    - src-nist-800-171r2
    - src-dod-cmmc-model-v2
  - id: SR-SPA-001
    summary: In scope when the component provides security functions protecting CUI assets (identity, logging, EDR, scanning,
      network controls).
    in_scope_when:
      any:
      - field: is_security_service
        equals_any:
        - true
      - field: protects_cui_assets
        equals_any:
        - true
      - field: asset_role
        equals_any:
        - security_protection_asset
    affected_scoping_categories:
    - security_protection_asset
    design_implications:
    - Include as security protection asset; evidence must demonstrate continuous effectiveness and administrator access controls.
    source_ids:
    - src-dod-cmmc-ag-l2
    - src-nist-800-171r2
    - src-dod-cmmc-model-v2
  - id: SR-ESP-001
    summary: In scope when an external service provider stores/processes/transmits CUI/FCI or provides security/protection
      services to the enclave.
    in_scope_when:
      any:
      - field: uses_external_service_for_cui
        equals_any:
        - true
      - field: uses_external_service_for_security
        equals_any:
        - true
      - field: has_external_service_provider
        equals_any:
        - true
    affected_scoping_categories:
    - external_service_provider
    design_implications:
    - Document shared responsibility; require contracts/SLAs, evidence access, and boundary/interconnection documentation.
    source_ids:
    - src-dod-cmmc-ag-l2
    - src-nist-800-171r2
    - src-dod-cmmc-model-v2
  - id: SR-SA-001
    summary: Specialized assets may require alternate implementation/compensating controls but are still in scope if they
      touch CUI or provide protection.
    in_scope_when:
      any:
      - field: is_specialized_asset
        equals_any:
        - true
      - field: asset_type
        equals_any:
        - OT
        - IoT
        - lab_equipment
        - test_equipment
    affected_scoping_categories:
    - specialized_asset
    design_implications:
    - Define compensating controls, segmentation, and monitoring expectations; justify limitations in SSP.
    source_ids:
    - src-dod-cmmc-ag-l2
    - src-nist-800-171r2
    - src-dod-cmmc-model-v2
  evidence_minimum:
    must_have:
    - emx-risk-001
    - emx-risk-002
    nice_to_have:
    - emx-log-003
    - emx-boundary-001
  operationalization_notes: '- Prefer tenant-wide controls.

    - Document deviations and compensating controls with rationale.

    - Use repeatable exports/logs instead of one-off screenshots.'
  common_pitfalls:
  - Policies exist but are not enforced by configuration.
  - Evidence is ad-hoc (screenshots) instead of repeatable exports/logs.
  - Scope boundaries exclude systems that still touch CUI workflows.
  ui_help:
    advisor_description: Capture what is implemented, where it is enforced, and how it is evidenced. Prefer exports and logs
      over screenshots.
    why_it_matters: This practice reduces risk to CUI/FCI by ensuring consistent control operation and auditability.
    attainment_impact: Accurate answers drive correct RR scoping and prevent rework during Mission Plan execution.
  tag: FACT
  source_ids:
  - src-dod-cmmc-ag-l2
  - src-nist-800-171r2
  - src-dod-cmmc-model-v2
