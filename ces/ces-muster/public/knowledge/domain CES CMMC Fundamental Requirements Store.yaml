ces:
  artifact: ces_cmmc_fundamental_requirements_store
  version: 0.1.0
  generated_on: '2026-02-03T04:48:56Z'
  intent: Practice-granular catalog of CMMC-aligned requirements for CES; supports SI→RR scenario selection and Mission Plan
    traceability across Levels 1–3.
  authoritative_sources:
    government:
    - id: src-dod-cmmc-model-v2
      title: Cybersecurity Maturity Model Certification (CMMC) Model Overview v2.0
      url: https://dodcio.defense.gov/Portals/0/Documents/CMMC/ModelOverview_V2.0_FINAL2_20211202_508.pdf
      publisher: DoD CIO
      published_date: '2021-12-02'
    - id: src-dod-cmmc-ag-l1
      title: CMMC Self-Assessment Guide – Level 1 v2.0
      url: https://dodcio.defense.gov/Portals/0/Documents/CMMC/AG_Level1_V2.0_FinalDraft_20211210_508.pdf
      publisher: DoD CIO
      published_date: '2021-12-10'
    - id: src-dod-cmmc-ag-l2
      title: CMMC Assessment Guide – Level 2 v2.0
      url: https://dodcio.defense.gov/Portals/0/Documents/CMMC/AG_Level2_MasterV2.0_FINAL_202112016_508.pdf
      publisher: DoD CIO
      published_date: '2021-12-16'
    - id: src-far-52_204-21
      title: FAR 52.204-21 Basic Safeguarding of Covered Contractor Information Systems
      url: https://www.acquisition.gov/far/52.204-21
      publisher: FAR / acquisition.gov
      published_date: '2025-11-12'
    nist:
    - id: src-nist-800-171r2
      title: NIST SP 800-171 Rev. 2 Protecting CUI in Nonfederal Systems and Organizations
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-171r2.pdf
      publisher: NIST
      published_date: '2024-05-14'
    - id: src-nist-800-172
      title: NIST SP 800-172 Enhanced Security Requirements for Protecting CUI
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-172.pdf
      publisher: NIST
      published_date: '2021-02-18'
    - id: src-nist-800-172a
      title: NIST SP 800-172A Assessing Enhanced Security Requirements for Protecting CUI
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-172A.pdf
      publisher: NIST
      published_date: '2022-02-03'
  governance:
    non_negotiables:
    - Every requirement must be traceable to at least one authoritative source via source_ids.
    - Requirement_id uses CMMC-style practice identifiers (domain.level-nist_id).
    - Scoping rules must be explicit and support enclave boundary reasoning.
    - Evidence_minimum must reference EMX archetype IDs.
    tagging_policy:
      allowed_tags:
      - FACT
      - INFERENCE
      - OPEN_QUESTION
      rules:
      - Use FACT when text is directly taken from or is a faithful restatement of an authoritative source.
      - Use INFERENCE when mapping or interpretation is required (e.g., CES mapping of NIST 800-172 enhanced requirements
        to CMMC L3 practice IDs).
      - Use OPEN_QUESTION when an implementation detail depends on future DoD guidance or contract-specific flowdowns.
catalogs:
  domains:
  - code: AC
    name: Access Control
    description: Limit system access to authorized users/devices/processes and control use of system resources.
  - code: AT
    name: Awareness and Training
    description: Ensure users are trained and aware of cybersecurity responsibilities.
  - code: AU
    name: Audit and Accountability
    description: Create, protect, and review audit records for accountability and incident investigation.
  - code: CM
    name: Configuration Management
    description: Establish and maintain secure configurations and track changes.
  - code: IA
    name: Identification and Authentication
    description: Identify and authenticate users, devices, and processes.
  - code: IR
    name: Incident Response
    description: Detect, respond to, report, and recover from cybersecurity incidents.
  - code: MA
    name: Maintenance
    description: Control and monitor system maintenance and related tooling.
  - code: MP
    name: Media Protection
    description: Protect media containing CUI/FCI and control media access, transport, sanitization.
  - code: PS
    name: Personnel Security
    description: Ensure personnel and third parties are trustworthy and appropriately authorized.
  - code: PE
    name: Physical Protection
    description: Limit physical access to systems, equipment, and environments.
  - code: RA
    name: Risk Assessment
    description: Assess risk, scan for vulnerabilities, and manage risk decisions.
  - code: CA
    name: Security Assessment
    description: Assess controls, develop plans of action, and monitor compliance.
  - code: SC
    name: System and Communications Protection
    description: Protect communications and system boundaries; use cryptography and network controls.
  - code: SI
    name: System and Information Integrity
    description: Identify, report, and correct system flaws; protect against malicious code.
  evidence_archetypes:
  - id: emx-boundary-001
    name: Assessment boundary statement
    description: Formal narrative defining the assessment/enclave boundary, inclusions/exclusions, and rationale.
    preferred_forms:
    - Boundary statement document (PDF/Word)
    - Scope memo / charter
    - SSP boundary section excerpt
    collection_methods:
    - examine
    - interview
  - id: emx-boundary-002
    name: Network boundary diagram
    description: Diagram showing logical network segmentation, ingress/egress points, and boundary controls.
    preferred_forms:
    - Network diagram (Visio/PDF)
    - Cloud network topology export screenshot
    collection_methods:
    - examine
  - id: emx-boundary-003
    name: In-scope asset inventory
    description: Authoritative list of in-scope endpoints, servers, cloud services, and network components.
    preferred_forms:
    - CMDB export
    - MDM/Intune device inventory export
    - Cloud resource inventory export
    collection_methods:
    - examine
    - test
  - id: emx-boundary-004
    name: Interconnection / boundary agreements
    description: Documentation of interconnections and shared responsibility across connected networks/tenants.
    preferred_forms:
    - Interconnection agreement
    - Shared responsibility matrix excerpt
    - External connectivity register
    collection_methods:
    - examine
  - id: emx-dataflow-001
    name: CUI data flow diagram
    description: Diagram depicting where CUI is created, stored, processed, and transmitted across systems and users.
    preferred_forms:
    - Data flow diagram (Visio/PDF)
    - System context diagram
    collection_methods:
    - examine
    - interview
  - id: emx-dataflow-002
    name: CUI location register
    description: Register of systems/locations where CUI may reside, with handling rules per location.
    preferred_forms:
    - CUI register spreadsheet
    - SharePoint list export
    - Data classification inventory export
    collection_methods:
    - examine
  - id: emx-dataflow-003
    name: CUI marking/labeling procedure and examples
    description: Procedure and examples for identifying and marking CUI in primary workflows.
    preferred_forms:
    - Procedure document
    - Training excerpt
    - Sample marked documents (redacted)
    collection_methods:
    - examine
    - interview
  - id: emx-iam-001
    name: MFA enforcement evidence
    description: Proof that MFA is required for in-scope identities per policy and configuration.
    preferred_forms:
    - Conditional Access/MFA policy export
    - IdP policy screenshot
    - Sign-in logs showing MFA challenge
    collection_methods:
    - examine
    - test
  - id: emx-iam-002
    name: Legacy authentication blocked evidence
    description: Proof that legacy/basic authentication is disabled or blocked for in-scope identities.
    preferred_forms:
