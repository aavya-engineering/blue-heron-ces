      - "Get-AzNetworkSecurityGroup | ForEach-Object { $nsg=$_; $_.SecurityRules | Select @{N='NSG';E={$nsg.Name}},Name,Direction,Access,Priority,SourceAddressPrefix,DestinationPortRange } | Export-Csv nsg_rules.csv"

