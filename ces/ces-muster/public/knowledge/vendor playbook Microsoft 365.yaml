# CES Vendor Playbook — Microsoft 365 / Azure
# Maps each implementation pattern action to specific M365 services,
# admin portal paths, PowerShell/Graph API commands, and evidence collection.
#
# For policy/document actions: references M365 tools that support the process.
# For configuration actions: provides specific portal paths and automation commands.
# For monitoring actions: provides Sentinel/Defender query and alert setup.
#
# m365_service: primary M365 product
# portal_path: admin center navigation
# powershell: automation commands (Connect-* assumed already run)
# graph_api: Microsoft Graph REST calls where applicable
# evidence_commands: commands to export evidence artifacts
# notes: caveats, prerequisites, or alternatives

ces:
  artifact: vendor_playbook
  vendor: microsoft_365
  version: "1.0.0"
  generated_on: "2026-02-07"
  license_requirements:
    - Microsoft 365 E5 or E5 Security (recommended for full coverage)
    - Microsoft 365 E3 + E5 Security add-on (minimum for most controls)
    - Azure P2 license for PIM, Access Reviews, Identity Protection
    - Microsoft Sentinel (consumption-based)

# =============================================================================
# IDENTITY & ACCESS MANAGEMENT (IAM)
# =============================================================================
playbook:

  - action_id: IAM-001-01
    signal: manual
    m365_service: Compliance Manager
    implementation: Use Compliance Manager CMMC assessment template to document access control policy
    portal_path: compliance.microsoft.com > Compliance Manager > Assessments
    evidence_commands:
      - "# Export assessment report from Compliance Manager portal"
    notes: Policy document; M365 provides template scaffolding only

  - action_id: IAM-001-02
    signal: configure
    m365_service: Entra ID
    implementation: Configure Entra ID as identity provider with Lifecycle Workflows for automated provisioning/deprovisioning
    portal_path: entra.microsoft.com > Identity > Users > Lifecycle Workflows
    powershell:
      - "Connect-MgGraph -Scopes 'User.ReadWrite.All','LifecycleWorkflows.ReadWrite.All'"
      - "New-MgIdentityGovernanceLifecycleWorkflow -DisplayName 'Onboard new hire' -Category 'joiner' ..."
      - "New-MgIdentityGovernanceLifecycleWorkflow -DisplayName 'Offboard employee' -Category 'leaver' ..."
    evidence_commands:
      - "Get-MgUser -All | Select DisplayName,AccountEnabled,CreatedDateTime | Export-Csv active_users.csv"
      - "Get-MgIdentityGovernanceLifecycleWorkflow | Select DisplayName,Category,IsEnabled"

  - action_id: IAM-001-03
    signal: configure
    m365_service: Entra ID Governance
    implementation: Create Entra ID Access Reviews for all privileged and standard access on quarterly schedule
    portal_path: entra.microsoft.com > Identity Governance > Access Reviews > New access review
    powershell:
      - "Connect-MgGraph -Scopes 'AccessReview.ReadWrite.All'"
      - "New-MgIdentityGovernanceAccessReviewDefinition -DisplayName 'Quarterly Access Review' -Scope @{query='...'} -Reviewers @(@{query='/me'}) -Settings @{mailNotificationsEnabled=$true; recurrence=@{pattern=@{type='absoluteMonthly';interval=3}}}"
    evidence_commands:
      - "Get-MgIdentityGovernanceAccessReviewDefinition | Select DisplayName,Status,Schedule"
      - "Get-MgIdentityGovernanceAccessReviewDefinitionInstance -AccessReviewScheduleDefinitionId {id} | Select Status,StartDateTime,EndDateTime"

  - action_id: IAM-002-01
    signal: manual
    m365_service: Compliance Manager
    implementation: Document account management lifecycle procedures; reference Entra ID Lifecycle Workflows as implementation mechanism
    portal_path: compliance.microsoft.com > Compliance Manager
    evidence_commands:
      - "# Export account management policy document from Compliance Manager"

  - action_id: IAM-002-02
    signal: configure
    m365_service: Entra ID
    implementation: Configure Lifecycle Workflows with HR-driven triggers (Workday/SAP SuccessFactors connector or CSV-based)
    portal_path: entra.microsoft.com > Identity > Users > Lifecycle Workflows > Create workflow
    powershell:
      - "# Configure HR provisioning connector"
      - "New-MgIdentityGovernanceLifecycleWorkflow -Category 'joiner' -ExecutionConditions @{trigger=@{type='attributeChanges';value=@{attributeName='employeeHireDate'}}} -Tasks @(@{taskDefinitionId='...';displayName='Create user account'})"
    evidence_commands:
      - "Get-MgIdentityGovernanceLifecycleWorkflow | Select DisplayName,Category,IsEnabled,LastModifiedDateTime"
      - "Get-MgAuditLogProvisioning -Top 50 | Select ActivityDisplayName,StatusInfo,InitiatedBy"

  - action_id: IAM-002-03
    signal: configure
    m365_service: Entra ID
    implementation: Configure sign-in activity policy to disable accounts after 90 days of inactivity
    portal_path: entra.microsoft.com > Identity > Users > User settings
    powershell:
      - "$inactiveDate = (Get-Date).AddDays(-90)"
      - "Get-MgUser -All -Property SignInActivity | Where-Object { $_.SignInActivity.LastSignInDateTime -lt $inactiveDate -and $_.AccountEnabled } | ForEach-Object { Update-MgUser -UserId $_.Id -AccountEnabled:$false }"
    evidence_commands:
      - "Get-MgUser -All -Property SignInActivity,AccountEnabled | Select DisplayName,AccountEnabled,@{N='LastSignIn';E={$_.SignInActivity.LastSignInDateTime}} | Export-Csv account_activity.csv"

  - action_id: IAM-002-04
    signal: configure
    m365_service: Entra ID Governance
    implementation: Create recurring Access Reviews requiring manager sign-off for all group memberships and app assignments
    portal_path: entra.microsoft.com > Identity Governance > Access Reviews
    powershell:
      - "New-MgIdentityGovernanceAccessReviewDefinition -DisplayName 'Manager Account Review' -Reviewers @(@{query='./manager'}) -Settings @{autoApplyDecisionsEnabled=$true}"
    evidence_commands:
      - "Get-MgIdentityGovernanceAccessReviewDefinitionInstanceDecision -AccessReviewScheduleDefinitionId {id} -AccessReviewInstanceId {instanceId} | Select Principal,Decision,ReviewedBy"

  - action_id: IAM-003-01
    signal: customize
    m365_service: Entra ID
    implementation: Document RBAC model; export current Entra ID role assignments and app role assignments as baseline
    portal_path: entra.microsoft.com > Identity > Roles and administrators
    evidence_commands:
      - "Get-MgDirectoryRole | ForEach-Object { $role=$_; Get-MgDirectoryRoleMember -DirectoryRoleId $_.Id | Select @{N='Role';E={$role.DisplayName}},@{N='Member';E={$_.AdditionalProperties.displayName}} } | Export-Csv rbac_model.csv"

  - action_id: IAM-003-02
    signal: configure
    m365_service: Entra ID
    implementation: Configure Entra ID directory roles, administrative units, and application roles per RBAC model
    portal_path: entra.microsoft.com > Identity > Roles and administrators > Add assignments
    powershell:
      - "New-MgRoleManagementDirectoryRoleAssignment -PrincipalId {userId} -RoleDefinitionId {roleId} -DirectoryScopeId '/'"
      - "# For app roles: New-MgServicePrincipalAppRoleAssignment"
    evidence_commands:
      - "Get-MgRoleManagementDirectoryRoleAssignment -All | Select PrincipalId,RoleDefinitionId,DirectoryScopeId | Export-Csv role_assignments.csv"

  - action_id: IAM-004-01
    signal: configure
    m365_service: Entra ID PIM
    implementation: Export all privileged role holders from PIM; document as privileged account inventory
    portal_path: entra.microsoft.com > Identity Governance > Privileged Identity Management > Entra roles
    powershell:
      - "Get-MgRoleManagementDirectoryRoleAssignmentSchedule -All | Select PrincipalId,RoleDefinitionId,AssignmentType,ScheduleInfo"
    evidence_commands:
      - "Get-MgRoleManagementDirectoryRoleEligibilitySchedule -All | Select PrincipalId,RoleDefinitionId,Status | Export-Csv privileged_account_inventory.csv"

  - action_id: IAM-004-02
    signal: configure
    m365_service: Entra ID PIM
    implementation: Configure PIM requiring justification, approval, and MFA for privileged role activation with maximum 8-hour duration
    portal_path: entra.microsoft.com > Identity Governance > PIM > Entra roles > Settings
    powershell:
      - "# Configure PIM role settings via Graph API"
      - "Update-MgPolicyRoleManagementPolicyRule -UnifiedRoleManagementPolicyId {policyId} -UnifiedRoleManagementPolicyRuleId {ruleId} -AdditionalProperties @{setting=@{isApprovalRequired=$true;approvalMode='Serial';approvalStages=@(@{approvers=@(@{query='/groups/{groupId}'})})}}"
    evidence_commands:
      - "Get-MgRoleManagementDirectoryRoleAssignmentSchedule -All | Select PrincipalId,RoleDefinitionId,AssignmentType,ScheduleInfo | Export-Csv pim_config_export.csv"
      - "Get-MgAuditLogDirectoryAudit -Filter \"activityDisplayName eq 'Add member to role completed (PIM activation)'\" -Top 100 | Export-Csv elevation_logs.csv"

  - action_id: IAM-004-03
    signal: configure
    m365_service: Conditional Access
    implementation: Create Conditional Access policy requiring compliant/hybrid-joined device and trusted location for admin portal access
    portal_path: entra.microsoft.com > Protection > Conditional Access > New policy
    powershell:
      - "New-MgIdentityConditionalAccessPolicy -DisplayName 'Require PAW for Admin Access' -Conditions @{users=@{includeRoles=@('62e90394-69f5-4237-9190-012177145e10')};applications=@{includeApplications=@('All')};platforms=@{includePlatforms=@('windows')}} -GrantControls @{builtInControls=@('compliantDevice');operator='OR'} -State 'enabled'"
    evidence_commands:
      - "Get-MgIdentityConditionalAccessPolicy | Where DisplayName -like '*PAW*' | Select DisplayName,State,Conditions,GrantControls | ConvertTo-Json -Depth 5"

  - action_id: IAM-005-01
    signal: manual
    m365_service: Entra ID Governance
    implementation: Document SoD matrix; use Entra ID incompatible access packages to enforce
    portal_path: entra.microsoft.com > Identity Governance > Entitlement Management > Incompatible access packages
    evidence_commands:
      - "# Export SoD matrix document from governance documentation"

  - action_id: IAM-005-02
    signal: configure
    m365_service: Entra ID Governance
    implementation: Configure incompatible access packages in Entitlement Management to prevent conflicting role assignments
    portal_path: entra.microsoft.com > Identity Governance > Entitlement Management > Access packages
    powershell:
      - "New-MgEntitlementManagementAccessPackageIncompatibleAccessPackage -AccessPackageId {pkgA} -BodyParameter @{'@odata.id'='https://graph.microsoft.com/v1.0/identityGovernance/entitlementManagement/accessPackages/{pkgB}'}"
    evidence_commands:
      - "Get-MgEntitlementManagementAccessPackageIncompatibleAccessPackage -AccessPackageId {pkgId} | Select DisplayName,Id"

  - action_id: IAM-006-01
    signal: manual
    m365_service: Compliance Manager
    implementation: Document least privilege policy; reference Entra ID PIM and Conditional Access as enforcement mechanisms
    evidence_commands:
      - "# Export least privilege policy document"

  - action_id: IAM-006-02
    signal: configure
    m365_service: Conditional Access
    implementation: Create baseline Conditional Access policy blocking all access by default, with explicit grant policies per scenario
    portal_path: entra.microsoft.com > Protection > Conditional Access > New policy
    powershell:
      - "# Block all by default policy"
      - "New-MgIdentityConditionalAccessPolicy -DisplayName 'Default Block All' -Conditions @{users=@{includeUsers=@('All')};applications=@{includeApplications=@('All')}} -GrantControls @{builtInControls=@('block');operator='OR'} -State 'enabledForReportingButNotEnforced'"
      - "# Then create specific allow policies with higher priority"
    evidence_commands:
      - "Get-MgIdentityConditionalAccessPolicy | Select DisplayName,State,CreatedDateTime | Export-Csv conditional_access_policies.csv"

  - action_id: IAM-006-03
    signal: customize
    m365_service: Entra ID Governance
    implementation: Schedule quarterly Access Reviews to identify and remove excess permissions
    portal_path: entra.microsoft.com > Identity Governance > Access Reviews
    evidence_commands:
      - "Get-MgIdentityGovernanceAccessReviewDefinition | Select DisplayName,Status,Schedule | Export-Csv access_reviews.csv"

  - action_id: IAM-007-01
    signal: configure
    m365_service: Entra ID
    implementation: Create separate cloud-only admin accounts (admin_user@domain) without M365 license for admin duties; block admin accounts from email/Teams
    portal_path: entra.microsoft.com > Identity > Users > New user
    powershell:
      - "New-MgUser -DisplayName 'Admin - John Smith' -UserPrincipalName 'admin_jsmith@contoso.com' -AccountEnabled -PasswordProfile @{forceChangePasswordNextSignIn=$true;password='TempP@ss!'} -MailNickname 'admin_jsmith'"
      - "# Create CA policy blocking admin accounts from Exchange/Teams"
    evidence_commands:
      - "Get-MgUser -Filter \"startsWith(displayName,'Admin')\" | Select DisplayName,UserPrincipalName,AccountEnabled | Export-Csv admin_accounts.csv"

  - action_id: IAM-008-01
    signal: configure
    m365_service: Entra ID
    implementation: Ensure non-admin users cannot access admin portals; configure Conditional Access to block non-privileged users from Azure/M365 admin centers
    portal_path: entra.microsoft.com > Protection > Conditional Access
    powershell:
      - "New-MgIdentityConditionalAccessPolicy -DisplayName 'Block Non-Admin from Admin Portals' -Conditions @{users=@{excludeRoles=@('62e90394-69f5-4237-9190-012177145e10')};applications=@{includeApplications=@('c44b4083-3bb0-49c1-b47d-974e53cbdf3c')}} -GrantControls @{builtInControls=@('block');operator='OR'} -State 'enabled'"
    evidence_commands:
      - "Get-MgIdentityConditionalAccessPolicy | Where DisplayName -like '*Admin Portal*' | ConvertTo-Json -Depth 5"

  - action_id: IAM-009-01
    signal: configure
    m365_service: Entra ID
    implementation: Configure Entra ID Smart Lockout with threshold of 10 attempts and 60-second lockout duration
    portal_path: entra.microsoft.com > Protection > Authentication methods > Password protection
    powershell:
      - "# Smart Lockout is configured in Azure Portal; verify via Graph"
      - "Get-MgPolicyAuthenticationMethodPolicy"
    evidence_commands:
      - "# Screenshot Smart Lockout settings from portal"
      - "Get-MgAuditLogSignIn -Filter \"status/errorCode eq 50053\" -Top 100 | Select UserPrincipalName,CreatedDateTime,Status | Export-Csv lockout_events.csv"

  - action_id: IAM-010-01
    signal: manual
    m365_service: Compliance Manager
    implementation: Draft system use notification banner text meeting DoD/organizational requirements
    evidence_commands:
      - "# Export banner text document"

  - action_id: IAM-010-02
    signal: customize
    m365_service: Entra ID + Intune
    implementation: Configure Entra ID custom branding with use notification text on sign-in page; deploy logon banner via Intune device configuration
    portal_path: entra.microsoft.com > Identity > Company branding > Edit > Sign-in page text
    powershell:
      - "# Intune device config for Windows logon banner"
      - "# Create Settings Catalog profile: Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options > Interactive logon: Message text/title"
    evidence_commands:
      - "Get-MgOrganizationBranding | Select SignInPageText"
      - "# Screenshot Entra ID sign-in page showing banner"

  - action_id: IAM-011-01
    signal: configure
    m365_service: Intune + Conditional Access
    implementation: Deploy Intune device configuration for 15-minute screen lock timeout; set Conditional Access sign-in frequency to 12 hours
    portal_path: intune.microsoft.com > Devices > Configuration > Create > Settings catalog
    powershell:
      - "# Intune Settings Catalog: MaxInactivityTimeLock = 15 minutes"
      - "# Conditional Access sign-in frequency"
      - "New-MgIdentityConditionalAccessPolicy -DisplayName 'Session Lock 12hr' -SessionControls @{signInFrequency=@{value=12;type='hours';isEnabled=$true}} -State 'enabled'"
    evidence_commands:
      - "Get-MgDeviceManagementDeviceConfiguration | Where DisplayName -like '*screen lock*' | Select DisplayName,Id"

  - action_id: IAM-012-01
    signal: configure
    m365_service: Conditional Access
    implementation: Configure Conditional Access persistent browser session controls; disable 'stay signed in' and set session lifetime
    portal_path: entra.microsoft.com > Protection > Conditional Access > Session controls
    powershell:
      - "New-MgIdentityConditionalAccessPolicy -DisplayName 'Session Termination' -SessionControls @{persistentBrowser=@{mode='never';isEnabled=$true};signInFrequency=@{value=12;type='hours';isEnabled=$true}} -State 'enabled'"
    evidence_commands:
      - "Get-MgIdentityConditionalAccessPolicy | Where DisplayName -like '*Session*' | Select DisplayName,SessionControls | ConvertTo-Json -Depth 4"

  - action_id: IAM-013-01
    signal: manual
    m365_service: Compliance Manager
    implementation: Document critical operations requiring dual authorization (e.g., Global Admin changes, eDiscovery, DLP policy changes)
    evidence_commands:
      - "# Export critical operations inventory document"

  - action_id: IAM-013-02
    signal: customize
    m365_service: Entra ID PIM
    implementation: Configure PIM with approval workflows requiring a second authorized individual for critical role activations
    portal_path: entra.microsoft.com > Identity Governance > PIM > Entra roles > Settings > Require approval
    powershell:
      - "# Configure approval requirement on Global Admin PIM role"
      - "# Set approvers to a security group of authorized approvers"
    evidence_commands:
      - "Get-MgAuditLogDirectoryAudit -Filter \"activityDisplayName eq 'Add member to role completed (PIM activation)'\" | Select ActivityDisplayName,InitiatedBy,TargetResources | Export-Csv dual_auth_logs.csv"

  - action_id: IAM-020-01
    signal: configure
    m365_service: Entra ID
    implementation: Entra ID inherently assigns unique ObjectId and UPN to each user; verify no shared accounts exist
    portal_path: entra.microsoft.com > Identity > Users
    powershell:
      - "Get-MgUser -All | Select Id,UserPrincipalName,DisplayName,AccountEnabled"
    evidence_commands:
      - "Get-MgUser -All | Select Id,UserPrincipalName,DisplayName,UserType | Export-Csv unique_user_ids.csv"
      - "# Verify no shared/generic accounts: Get-MgUser -Filter \"startsWith(displayName,'shared')\" "

  - action_id: IAM-021-01
    signal: configure
    m365_service: Entra ID
    implementation: Configure device registration, managed identities for services, and service principals with certificates
    portal_path: entra.microsoft.com > Identity > Devices + App registrations
    powershell:
      - "Get-MgDevice -All | Select DisplayName,DeviceId,OperatingSystem,TrustType"
      - "Get-MgServicePrincipal -All | Select DisplayName,ServicePrincipalType,AccountEnabled"
    evidence_commands:
      - "Get-MgUser -All | Measure-Object | Select Count"
      - "Get-MgDevice -All | Measure-Object | Select Count"
      - "Get-MgServicePrincipal -All -Filter \"servicePrincipalType eq 'ManagedIdentity'\" | Select DisplayName | Export-Csv managed_identities.csv"

  - action_id: IAM-022-01
    signal: configure
    m365_service: Entra ID
    implementation: Configure Entra ID authentication methods (password + MFA) as required authentication mechanisms
    portal_path: entra.microsoft.com > Protection > Authentication methods
    powershell:
      - "Get-MgPolicyAuthenticationMethodPolicy | Select -ExpandProperty AuthenticationMethodConfigurations | Select Id,State"
    evidence_commands:
      - "Get-MgReportAuthenticationMethodUserRegistrationDetail | Select UserPrincipalName,MethodsRegistered,IsMfaRegistered | Export-Csv auth_methods_report.csv"

  - action_id: IAM-023-01
    signal: configure
    m365_service: Intune + Entra ID
    implementation: Configure Intune device enrollment with compliance policies; require Entra ID device registration
    portal_path: intune.microsoft.com > Devices > Enrollment + Compliance policies
    powershell:
      - "Get-MgDeviceManagementDeviceCompliancePolicy | Select DisplayName,Id,LastModifiedDateTime"
    evidence_commands:
      - "Get-MgDevice -All | Select DisplayName,DeviceId,IsCompliant,TrustType,OperatingSystem | Export-Csv device_enrollment.csv"
      - "Get-MgDeviceManagementDeviceCompliancePolicy | Select DisplayName | Export-Csv compliance_policies.csv"

  - action_id: IAM-024-01
    signal: manual
    m365_service: Compliance Manager
    implementation: Document MFA policy specifying local, network, and privileged access scenarios where MFA is required
    evidence_commands:
      - "# Export MFA policy document"

  - action_id: IAM-024-02
    signal: configure
    m365_service: Conditional Access
    implementation: Create Conditional Access policies requiring MFA for all users, all cloud apps, with trusted location exceptions if needed
    portal_path: entra.microsoft.com > Protection > Conditional Access > New policy
    powershell:
      - "New-MgIdentityConditionalAccessPolicy -DisplayName 'Require MFA - All Users' -Conditions @{users=@{includeUsers=@('All')};applications=@{includeApplications=@('All')}} -GrantControls @{builtInControls=@('mfa');operator='OR'} -State 'enabled'"
    evidence_commands:
      - "Get-MgIdentityConditionalAccessPolicy | Where {$_.GrantControls.BuiltInControls -contains 'mfa'} | Select DisplayName,State | Export-Csv mfa_policies.csv"
      - "Get-MgReportAuthenticationMethodUserRegistrationDetail | Where IsMfaRegistered -eq $false | Select UserPrincipalName | Export-Csv users_without_mfa.csv"

  - action_id: IAM-025-01
    signal: configure
    m365_service: Entra ID
    implementation: Enable FIDO2 security keys and/or certificate-based authentication as replay-resistant methods; disable SMS/voice
    portal_path: entra.microsoft.com > Protection > Authentication methods > FIDO2 security key + Certificate-based
    powershell:
      - "# Enable FIDO2 via Authentication Methods Policy"
      - "Update-MgPolicyAuthenticationMethodPolicyAuthenticationMethodConfiguration -AuthenticationMethodConfigurationId 'fido2' -State 'enabled'"
    evidence_commands:
      - "Get-MgPolicyAuthenticationMethodPolicy | Select -ExpandProperty AuthenticationMethodConfigurations | Where Id -in 'fido2','x509Certificate' | Select Id,State"

  - action_id: IAM-026-01
    signal: configure
    m365_service: Entra ID
    implementation: Entra ID prevents identifier reuse via 30-day soft-delete; verify soft-delete is not bypassed
    portal_path: entra.microsoft.com > Identity > Users > Deleted users
    powershell:
      - "Get-MgDirectoryDeletedItemAsUser | Select DisplayName,DeletedDateTime,UserPrincipalName"
    evidence_commands:
      - "Get-MgDirectoryDeletedItemAsUser | Select DisplayName,DeletedDateTime | Export-Csv deleted_users_softdelete.csv"
    notes: Entra ID inherently prevents UPN reuse for 30 days after deletion

  - action_id: IAM-027-01
    signal: configure
    m365_service: Entra ID
    implementation: Configure automated script or Lifecycle Workflow to disable accounts after 90 days of sign-in inactivity
    portal_path: entra.microsoft.com > Identity > Users > Lifecycle Workflows
    powershell:
      - "$threshold = (Get-Date).AddDays(-90)"
      - "Get-MgUser -All -Property SignInActivity | Where { $_.SignInActivity.LastSignInDateTime -lt $threshold -and $_.AccountEnabled } | ForEach-Object { Update-MgUser -UserId $_.Id -AccountEnabled:$false }"
    evidence_commands:
      - "Get-MgUser -All -Property SignInActivity,AccountEnabled | Where AccountEnabled -eq $false | Select DisplayName,@{N='LastSignIn';E={$_.SignInActivity.LastSignInDateTime}} | Export-Csv disabled_inactive_accounts.csv"

  - action_id: IAM-028-01
    signal: configure
    m365_service: Entra ID
    implementation: Configure Entra ID Password Protection with custom banned password list and minimum 14-character length
    portal_path: entra.microsoft.com > Protection > Authentication methods > Password protection
    powershell:
      - "# Password Protection settings via portal; verify:"
      - "Get-MgPolicyAuthenticationMethodPolicy"
    evidence_commands:
      - "# Screenshot Password Protection settings showing complexity and banned list"

  - action_id: IAM-029-01
    signal: manual
    m365_service: Entra ID
    implementation: Entra ID cloud-only users use NIST 800-63B guidance (no periodic rotation, banned password list); for hybrid, configure AD password history
    portal_path: entra.microsoft.com > Protection > Authentication methods > Password protection
    evidence_commands:
      - "# Document password policy configuration and NIST alignment"
    notes: Microsoft recommends eliminating periodic password rotation per NIST 800-63B; use banned passwords + MFA instead

  - action_id: IAM-030-01
    signal: configure
    m365_service: Entra ID
    implementation: Configure Temporary Access Pass (TAP) with one-time use and defined lifetime for initial authentication
    portal_path: entra.microsoft.com > Protection > Authentication methods > Temporary Access Pass
    powershell:
      - "Update-MgPolicyAuthenticationMethodPolicyAuthenticationMethodConfiguration -AuthenticationMethodConfigurationId 'temporaryAccessPass' -State 'enabled' -AdditionalProperties @{defaultLifetimeInMinutes=60;isUsableOnce=$true}"
    evidence_commands:
      - "Get-MgPolicyAuthenticationMethodPolicy | Select -ExpandProperty AuthenticationMethodConfigurations | Where Id -eq 'temporaryAccessPass' | ConvertTo-Json"

  - action_id: IAM-031-01
    signal: manual
    m365_service: Entra ID
    implementation: Entra ID stores passwords using PBKDF2 with per-user salt (inherent); verify no legacy hash storage
    portal_path: N/A - inherent platform security
    evidence_commands:
      - "# Reference Microsoft documentation on Entra ID password storage: PBKDF2 with per-user salt"
      - "# For hybrid AD: Verify FIPS-compliant hash in AD DS"
    notes: Entra ID inherently uses approved cryptographic hashing; document verification

  - action_id: IAM-032-01
    signal: manual
    m365_service: Entra ID
    implementation: Entra ID sign-in page inherently masks password input; verify custom apps also mask
    portal_path: N/A - inherent platform behavior
    evidence_commands:
      - "# Screenshot Entra ID sign-in page showing password field masking"
    notes: Inherent M365 behavior; verify any custom applications also comply

  - action_id: IAM-033-01
    signal: configure
    m365_service: Entra ID + Azure Key Vault
    implementation: Configure managed identities for Azure services; use certificates or federated credentials for cross-system auth
    portal_path: portal.azure.com > Resource > Identity > System assigned managed identity
    powershell:
      - "Get-MgServicePrincipal -Filter \"servicePrincipalType eq 'ManagedIdentity'\" | Select DisplayName,AppId"
      - "Get-MgApplication -All | Select DisplayName,@{N='CertCount';E={($_.KeyCredentials | Measure).Count}}"
    evidence_commands:
      - "Get-MgServicePrincipal -All -Filter \"servicePrincipalType eq 'ManagedIdentity'\" | Select DisplayName,AppId | Export-Csv managed_identities.csv"

  - action_id: IAM-034-01
    signal: configure
    m365_service: Azure Key Vault
    implementation: Configure Key Vault certificate and secret rotation policies with automated renewal
    portal_path: portal.azure.com > Key Vault > Certificates > Rotation policy
    powershell:
      - "Set-AzKeyVaultSecret -VaultName {vault} -Name {secret} -Expires (Get-Date).AddDays(90)"
      - "# Configure rotation policy via Azure Policy or Key Vault lifecycle management"
    evidence_commands:
      - "Get-AzKeyVaultSecret -VaultName {vault} | Select Name,Expires,Created | Export-Csv secret_rotation_status.csv"

  - action_id: IAM-035-01
    signal: customize
    m365_service: Entra ID
    implementation: Configure Entra ID Password Protection with custom banned password list including known compromised passwords
    portal_path: entra.microsoft.com > Protection > Authentication methods > Password protection > Custom banned passwords
    powershell:
      - "# Upload custom banned password list via portal"
      - "# Enable Entra ID Identity Protection sign-in risk policies"
    evidence_commands:
      - "# Screenshot banned password list configuration"
      - "Get-MgIdentityProtectionRiskyUser | Select UserPrincipalName,RiskLevel,RiskState | Export-Csv risky_users.csv"

  # =============================================================================
  # NETWORK & BOUNDARY PROTECTION (NBP)
  # =============================================================================

  - action_id: NBP-001-01
    signal: customize
    m365_service: Compliance Manager
    implementation: Document all external system connections; reference Azure Network Watcher topology for cloud connections
    portal_path: portal.azure.com > Network Watcher > Topology
    evidence_commands:
      - "Get-AzNetworkWatcherTopology -NetworkWatcherName {name} -ResourceGroupName {rg} -TargetResourceGroupName {rg}"

  - action_id: NBP-001-02
    signal: configure
    m365_service: Azure Firewall + NSGs
