      - "# SigninLogs | where IsInteractive == true | where NetworkLocationDetails contains 'untrusted' | summarize count() by UserPrincipalName, IPAddress, bin(TimeGenerated, 1h)"
    evidence_commands:
      - "# Export Sentinel analytics rules"
      - "Get-AzSentinelAlertRule -WorkspaceName {ws} -ResourceGroupName {rg} | Select DisplayName,Severity,Enabled | Export-Csv sentinel_rules.csv"

