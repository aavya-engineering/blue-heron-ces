# CES Implementation Patterns
# Vendor-agnostic implementation actions for each CMMC practice.
# Each pattern describes WHAT to do, not HOW (vendor-specific HOW lives in playbooks).
#
# action_type values:
#   policy         - Create/update a written policy or procedure document
#   configuration  - Configure a system, service, or tool
#   process        - Establish an operational process or workflow
#   monitoring     - Set up ongoing monitoring, alerting, or review
#   training       - Deliver training or awareness content
#   assessment     - Perform an evaluation, scan, or test
#
# evidence_outputs reference evidence archetypes that the action produces.
# These map to vendor playbook evidence collection commands.

ces:
  artifact: implementation_patterns
  version: "1.0.0"
  generated_on: "2026-02-07"

# =============================================================================
# IDENTITY & ACCESS MANAGEMENT (IAM)
# =============================================================================
patterns:

  # --- AC.L1-3.1.1 / AC.L2-3.1.1 Authorized Access ---
  - practice_id: AC.L1-3.1.1
    capability: identity_access_management
    pattern_id: IAM-001
    pattern_name: Enforce Authorized Access
    actions:
      - id: IAM-001-01
        action: Define access control policy specifying who is authorized to access which systems and data
        action_type: policy
        evidence_outputs: [access_control_policy]
      - id: IAM-001-02
        action: Configure identity provider to provision and deprovision user accounts based on authorization
        action_type: configuration
        evidence_outputs: [user_provisioning_config, active_user_list]
      - id: IAM-001-03
        action: Implement access reviews on a defined schedule to validate continued authorization
        action_type: process
        evidence_outputs: [access_review_log, access_review_schedule]

  - practice_id: AC.L2-3.1.1
    capability: identity_access_management
    pattern_id: IAM-002
    pattern_name: Account Management Lifecycle
    actions:
      - id: IAM-002-01
        action: Define account management procedures covering creation, modification, disabling, and removal
        action_type: policy
        evidence_outputs: [account_management_policy]
      - id: IAM-002-02
        action: Configure automated account provisioning tied to HR onboarding and offboarding workflows
        action_type: configuration
        evidence_outputs: [provisioning_automation_config, account_lifecycle_logs]
      - id: IAM-002-03
        action: Configure account expiration and inactive account disablement rules
        action_type: configuration
        evidence_outputs: [account_expiration_policy_config]
      - id: IAM-002-04
        action: Establish periodic account review process with management sign-off
        action_type: process
        evidence_outputs: [account_review_records, manager_signoff_evidence]

  # --- AC.L1-3.1.2 / AC.L2-3.1.2 Transaction & Function Control ---
  - practice_id: AC.L1-3.1.2
    capability: identity_access_management
    pattern_id: IAM-003
    pattern_name: Transaction and Function Authorization
    actions:
      - id: IAM-003-01
        action: Define role-based access control model mapping roles to permitted transactions and functions
        action_type: policy
        evidence_outputs: [rbac_model_document]
      - id: IAM-003-02
        action: Configure role assignments in identity provider and applications
        action_type: configuration
        evidence_outputs: [role_assignment_export, application_permission_config]

  - practice_id: AC.L2-3.1.2
    capability: identity_access_management
    pattern_id: IAM-004
    pattern_name: Privileged Access Restriction
    actions:
      - id: IAM-004-01
        action: Identify and document all privileged roles and accounts
        action_type: policy
        evidence_outputs: [privileged_account_inventory]
      - id: IAM-004-02
        action: Configure privileged identity management with just-in-time elevation and approval workflows
        action_type: configuration
        evidence_outputs: [pim_config_export, elevation_approval_logs]
      - id: IAM-004-03
        action: Implement privileged access workstations or secure admin interfaces
        action_type: configuration
        evidence_outputs: [admin_workstation_config, admin_access_path_diagram]

  # --- AC.L2-3.1.4 Separation of Duties ---
  - practice_id: AC.L2-3.1.4
    capability: identity_access_management
    pattern_id: IAM-005
    pattern_name: Separation of Duties
    actions:
      - id: IAM-005-01
        action: Define separation of duties matrix identifying conflicting roles
        action_type: policy
        evidence_outputs: [sod_matrix_document]
      - id: IAM-005-02
        action: Configure role exclusions preventing conflicting role assignments
        action_type: configuration
        evidence_outputs: [role_exclusion_config, sod_violation_report]

  # --- AC.L2-3.1.5 / 3.1.6 / 3.1.7 Least Privilege ---
  - practice_id: AC.L2-3.1.5
    capability: identity_access_management
    pattern_id: IAM-006
    pattern_name: Least Privilege Enforcement
    actions:
      - id: IAM-006-01
        action: Define least privilege policy requiring minimum necessary access for each role
        action_type: policy
        evidence_outputs: [least_privilege_policy]
      - id: IAM-006-02
        action: Configure default deny access with explicit grants per role
        action_type: configuration
        evidence_outputs: [default_deny_config, permission_grant_audit]
      - id: IAM-006-03
        action: Implement periodic access certification to remove excess permissions
        action_type: process
        evidence_outputs: [access_certification_records]

  - practice_id: AC.L2-3.1.6
    capability: identity_access_management
    pattern_id: IAM-007
    pattern_name: Non-Privileged Account Use
    actions:
      - id: IAM-007-01
        action: Configure separate non-privileged accounts for daily use by administrators
        action_type: configuration
        evidence_outputs: [admin_account_separation_evidence, dual_account_policy]

  - practice_id: AC.L2-3.1.7
    capability: identity_access_management
    pattern_id: IAM-008
    pattern_name: Privileged Function Restriction
    actions:
      - id: IAM-008-01
        action: Configure system to prevent non-privileged users from executing privileged functions
        action_type: configuration
        evidence_outputs: [privilege_escalation_controls_config, function_restriction_audit]

  # --- AC.L2-3.1.8 Unsuccessful Logon ---
  - practice_id: AC.L2-3.1.8
    capability: identity_access_management
    pattern_id: IAM-009
    pattern_name: Failed Logon Lockout
    actions:
      - id: IAM-009-01
        action: Configure account lockout policy after defined number of failed attempts
        action_type: configuration
        evidence_outputs: [lockout_policy_config, lockout_event_logs]

  # --- AC.L2-3.1.9 System Use Notification ---
  - practice_id: AC.L2-3.1.9
    capability: identity_access_management
    pattern_id: IAM-010
    pattern_name: System Use Notification Banner
    actions:
      - id: IAM-010-01
        action: Define system use notification text per organizational and regulatory requirements
        action_type: policy
        evidence_outputs: [notification_banner_text]
      - id: IAM-010-02
        action: Configure logon banners on all in-scope systems displaying use notification
        action_type: configuration
        evidence_outputs: [banner_config_export, banner_screenshot]

  # --- AC.L2-3.1.10 / 3.1.11 Session Controls ---
  - practice_id: AC.L2-3.1.10
    capability: identity_access_management
    pattern_id: IAM-011
    pattern_name: Session Lock
    actions:
      - id: IAM-011-01
        action: Configure automatic session lock after defined inactivity period
        action_type: configuration
        evidence_outputs: [session_lock_policy_config, screen_lock_timeout_setting]

  - practice_id: AC.L2-3.1.11
    capability: identity_access_management
    pattern_id: IAM-012
    pattern_name: Session Termination
    actions:
      - id: IAM-012-01
        action: Configure automatic session termination after defined conditions or time period
        action_type: configuration
        evidence_outputs: [session_timeout_config, session_termination_logs]

  # --- AC.L3-3.1.1e Dual Authorization ---
  - practice_id: AC.L3-3.1.1e
    capability: identity_access_management
    pattern_id: IAM-013
    pattern_name: Dual Authorization for Critical Operations
    actions:
      - id: IAM-013-01
        action: Identify critical operations requiring dual authorization
        action_type: policy
        evidence_outputs: [critical_operations_inventory]
      - id: IAM-013-02
        action: Configure approval workflows requiring two authorized individuals for critical actions
        action_type: configuration
        evidence_outputs: [dual_auth_workflow_config, approval_logs]

  # --- IA.L1-3.5.1 / IA.L2-3.5.1 Identification ---
  - practice_id: IA.L1-3.5.1
    capability: identity_access_management
    pattern_id: IAM-020
    pattern_name: User Identification
    actions:
      - id: IAM-020-01
        action: Configure unique user identifiers for all system users
        action_type: configuration
        evidence_outputs: [user_identifier_list, unique_id_policy]

  - practice_id: IA.L2-3.5.1
    capability: identity_access_management
    pattern_id: IAM-021
    pattern_name: User, Process, and Device Identification
    actions:
      - id: IAM-021-01
        action: Configure unique identification for users, processes acting on behalf of users, and devices
        action_type: configuration
        evidence_outputs: [identity_inventory, service_account_list, device_identity_config]

  # --- IA.L1-3.5.2 / IA.L2-3.5.2 Authentication ---
  - practice_id: IA.L1-3.5.2
    capability: identity_access_management
    pattern_id: IAM-022
    pattern_name: User Authentication
    actions:
      - id: IAM-022-01
        action: Configure authentication mechanism to verify identity before granting access
        action_type: configuration
        evidence_outputs: [authentication_config, auth_method_documentation]

  - practice_id: IA.L2-3.5.2
    capability: identity_access_management
    pattern_id: IAM-023
    pattern_name: Device Authentication
    actions:
      - id: IAM-023-01
        action: Configure device authentication and enrollment requirements
        action_type: configuration
        evidence_outputs: [device_enrollment_config, device_compliance_policy, device_auth_logs]

  # --- IA.L2-3.5.3 Multifactor Authentication ---
  - practice_id: IA.L2-3.5.3
    capability: identity_access_management
    pattern_id: IAM-024
    pattern_name: Multifactor Authentication
    actions:
      - id: IAM-024-01
        action: Define MFA policy specifying where MFA is required (local access, network access, privileged access)
        action_type: policy
        evidence_outputs: [mfa_policy_document]
      - id: IAM-024-02
        action: Configure MFA enforcement via conditional access for all in-scope access paths
        action_type: configuration
        evidence_outputs: [conditional_access_mfa_config, mfa_registration_report, mfa_enforcement_logs]

  # --- IA.L2-3.5.4 Replay-Resistant ---
  - practice_id: IA.L2-3.5.4
    capability: identity_access_management
    pattern_id: IAM-025
    pattern_name: Replay-Resistant Authentication
    actions:
      - id: IAM-025-01
        action: Configure authentication protocols that are replay-resistant (FIDO2, certificate-based, OATH tokens)
        action_type: configuration
        evidence_outputs: [auth_protocol_config, replay_resistant_method_evidence]

  # --- IA.L2-3.5.5 / 3.5.6 Identifier Management ---
  - practice_id: IA.L2-3.5.5
    capability: identity_access_management
    pattern_id: IAM-026
    pattern_name: Identifier Reuse Prevention
    actions:
      - id: IAM-026-01
        action: Configure identity provider to prevent reuse of user identifiers for a defined period
        action_type: configuration
        evidence_outputs: [identifier_reuse_policy_config]

  - practice_id: IA.L2-3.5.6
    capability: identity_access_management
    pattern_id: IAM-027
    pattern_name: Identifier Disablement
    actions:
      - id: IAM-027-01
        action: Configure automatic disablement of identifiers after defined inactivity period
        action_type: configuration
        evidence_outputs: [inactive_account_policy_config, disabled_account_report]

  # --- IA.L2-3.5.7 / 3.5.8 / 3.5.9 / 3.5.10 / 3.5.11 Password Management ---
  - practice_id: IA.L2-3.5.7
    capability: identity_access_management
    pattern_id: IAM-028
    pattern_name: Password Complexity
    actions:
      - id: IAM-028-01
        action: Configure minimum password complexity requirements (length, character types)
        action_type: configuration
        evidence_outputs: [password_policy_config]

  - practice_id: IA.L2-3.5.8
    capability: identity_access_management
    pattern_id: IAM-029
    pattern_name: Password Reuse Prevention
    actions:
      - id: IAM-029-01
        action: Configure password history enforcement preventing reuse of recent passwords
        action_type: configuration
        evidence_outputs: [password_history_config]

  - practice_id: IA.L2-3.5.9
    capability: identity_access_management
    pattern_id: IAM-030
    pattern_name: Temporary Password Management
    actions:
      - id: IAM-030-01
        action: Configure temporary passwords to require change on first use with defined expiration
        action_type: configuration
        evidence_outputs: [temporary_password_policy_config]

  - practice_id: IA.L2-3.5.10
    capability: identity_access_management
    pattern_id: IAM-031
    pattern_name: Cryptographic Password Storage
    actions:
      - id: IAM-031-01
        action: Verify identity provider stores passwords using approved cryptographic hashing
        action_type: assessment
        evidence_outputs: [password_storage_verification, crypto_hash_config]

  - practice_id: IA.L2-3.5.11
    capability: identity_access_management
    pattern_id: IAM-032
    pattern_name: Authenticator Feedback Obscuring
    actions:
      - id: IAM-032-01
        action: Configure all login interfaces to obscure password entry feedback
        action_type: configuration
        evidence_outputs: [login_interface_config, password_masking_evidence]

  # --- IA.L3 Enhanced ---
  - practice_id: IA.L3-3.5.1e
    capability: identity_access_management
    pattern_id: IAM-033
    pattern_name: System-to-System Authentication
    actions:
      - id: IAM-033-01
        action: Configure mutual authentication between systems and components using certificates or tokens
        action_type: configuration
        evidence_outputs: [system_auth_config, certificate_inventory]

  - practice_id: IA.L3-3.5.2e
    capability: identity_access_management
    pattern_id: IAM-034
    pattern_name: Automated Authenticator Management
    actions:
      - id: IAM-034-01
        action: Configure automated credential rotation and lifecycle management
        action_type: configuration
        evidence_outputs: [credential_rotation_config, rotation_logs]

  - practice_id: IA.L3-3.5.3e
    capability: identity_access_management
    pattern_id: IAM-035
    pattern_name: Compromised Authenticator Prevention
    actions:
      - id: IAM-035-01
        action: Configure banned password lists and credential breach detection
        action_type: configuration
        evidence_outputs: [banned_password_config, breach_detection_config]

  # =============================================================================
  # NETWORK & BOUNDARY PROTECTION (NBP)
  # =============================================================================

  - practice_id: AC.L1-3.1.20
    capability: network_boundary_protection
    pattern_id: NBP-001
    pattern_name: External Connection Control
    actions:
      - id: NBP-001-01
        action: Inventory and document all external system connections
        action_type: policy
        evidence_outputs: [external_connection_inventory]
      - id: NBP-001-02
        action: Configure firewall rules and access controls for each authorized external connection
        action_type: configuration
        evidence_outputs: [firewall_rule_export, connection_authorization_records]

  - practice_id: AC.L2-3.1.12
    capability: network_boundary_protection
    pattern_id: NBP-002
    pattern_name: Remote Access Monitoring
    actions:
      - id: NBP-002-01
        action: Configure logging and monitoring for all remote access sessions
        action_type: monitoring
        evidence_outputs: [remote_access_logs, monitoring_dashboard_config]
      - id: NBP-002-02
        action: Define and enforce permitted remote access methods
        action_type: configuration
        evidence_outputs: [remote_access_policy_config, allowed_methods_list]

  - practice_id: AC.L2-3.1.13
    capability: network_boundary_protection
    pattern_id: NBP-003
    pattern_name: Remote Access Encryption
    actions:
      - id: NBP-003-01
        action: Configure encrypted tunnels (VPN/TLS) for all remote access connections
        action_type: configuration
        evidence_outputs: [vpn_config_export, tls_config_evidence]

  - practice_id: AC.L2-3.1.14
    capability: network_boundary_protection
    pattern_id: NBP-004
    pattern_name: Remote Access Routing
    actions:
      - id: NBP-004-01
        action: Configure remote access to route through managed access control points
        action_type: configuration
        evidence_outputs: [remote_access_gateway_config, network_diagram_showing_routing]

  - practice_id: AC.L2-3.1.15
    capability: network_boundary_protection
    pattern_id: NBP-005
    pattern_name: Privileged Remote Access Control
    actions:
      - id: NBP-005-01
        action: Configure privileged access to require additional authorization for remote sessions
        action_type: configuration
        evidence_outputs: [privileged_remote_policy_config, remote_admin_approval_logs]

  - practice_id: AC.L2-3.1.20
    capability: network_boundary_protection
    pattern_id: NBP-006
    pattern_name: External System Verification
    actions:
      - id: NBP-006-01
        action: Establish process to verify and authorize external system connections
        action_type: process
        evidence_outputs: [external_system_authorization_records, connection_review_logs]

  - practice_id: AC.L2-3.1.16
    capability: network_boundary_protection
    pattern_id: NBP-007
    pattern_name: Wireless Access Authorization
    actions:
      - id: NBP-007-01
        action: Configure wireless network authentication requiring authorization before connection
        action_type: configuration
        evidence_outputs: [wireless_auth_config, authorized_wireless_user_list]

  - practice_id: AC.L2-3.1.17
    capability: network_boundary_protection
    pattern_id: NBP-008
    pattern_name: Wireless Access Protection
    actions:
      - id: NBP-008-01
        action: Configure wireless encryption (WPA3/WPA2-Enterprise) and authentication protocols
        action_type: configuration
        evidence_outputs: [wireless_encryption_config, wireless_security_settings]

  - practice_id: SC.L1-3.13.1
    capability: network_boundary_protection
    pattern_id: NBP-010
    pattern_name: Basic Boundary Protection
    actions:
      - id: NBP-010-01
        action: Deploy and configure boundary protection devices at network perimeter
        action_type: configuration
        evidence_outputs: [firewall_config_export, boundary_device_inventory]

  - practice_id: SC.L1-3.13.5
    capability: network_boundary_protection
    pattern_id: NBP-011
    pattern_name: Public-Access System Separation
    actions:
      - id: NBP-011-01
        action: Separate public-facing systems into isolated network segments
        action_type: configuration
        evidence_outputs: [network_segmentation_diagram, dmz_config_export]

  - practice_id: SC.L2-3.13.1
    capability: network_boundary_protection
    pattern_id: NBP-012
    pattern_name: Boundary Monitoring and Control
    actions:
      - id: NBP-012-01
        action: Configure monitoring on all boundary protection devices
        action_type: monitoring
        evidence_outputs: [boundary_monitoring_config, boundary_alert_rules]
      - id: NBP-012-02
        action: Establish boundary traffic review process
        action_type: process
        evidence_outputs: [traffic_review_schedule, boundary_incident_logs]

  - practice_id: SC.L2-3.13.2
    capability: network_boundary_protection
    pattern_id: NBP-013
    pattern_name: Security Architecture Design
    actions:
      - id: NBP-013-01
        action: Document security architecture applying defense-in-depth principles
        action_type: policy
        evidence_outputs: [security_architecture_document, network_topology_diagram]

  - practice_id: SC.L2-3.13.3
    capability: network_boundary_protection
    pattern_id: NBP-014
    pattern_name: Application Partitioning
    actions:
      - id: NBP-014-01
        action: Separate user-facing application components from backend management functions
        action_type: configuration
        evidence_outputs: [application_architecture_diagram, partition_config]

  - practice_id: SC.L2-3.13.4
    capability: network_boundary_protection
    pattern_id: NBP-015
    pattern_name: Shared Resource Information Transfer Control
    actions:
      - id: NBP-015-01
        action: Configure controls preventing unauthorized data transfer through shared system resources
        action_type: configuration
        evidence_outputs: [shared_resource_controls_config]

  - practice_id: SC.L2-3.13.5
    capability: network_boundary_protection
    pattern_id: NBP-016
    pattern_name: Network Segmentation
    actions:
      - id: NBP-016-01
        action: Implement network segments isolating CUI processing from public-accessible components
        action_type: configuration
        evidence_outputs: [vlan_config_export, subnet_diagram, acl_rules_export]

  - practice_id: SC.L2-3.13.6
    capability: network_boundary_protection
    pattern_id: NBP-017
    pattern_name: Default Deny Network Policy
    actions:
      - id: NBP-017-01
        action: Configure firewall and network ACLs to deny all traffic by default, with explicit allow rules
        action_type: configuration
        evidence_outputs: [default_deny_rule_config, allow_list_export]

  - practice_id: SC.L2-3.13.7
    capability: network_boundary_protection
    pattern_id: NBP-018
    pattern_name: Split Tunneling Prevention
    actions:
      - id: NBP-018-01
        action: Configure VPN and remote access to prevent split tunneling for in-scope connections
        action_type: configuration
        evidence_outputs: [vpn_split_tunnel_config, remote_access_routing_evidence]

  - practice_id: SC.L2-3.13.9
    capability: network_boundary_protection
    pattern_id: NBP-019
    pattern_name: Network Session Termination
    actions:
      - id: NBP-019-01
        action: Configure automatic termination of network connections at session end or after inactivity
        action_type: configuration
        evidence_outputs: [session_timeout_network_config]

  - practice_id: SC.L2-3.13.12
    capability: network_boundary_protection
    pattern_id: NBP-020
    pattern_name: Collaborative Computing Control
    actions:
      - id: NBP-020-01
        action: Configure policies preventing unauthorized remote activation of collaborative computing devices
        action_type: configuration
        evidence_outputs: [collaboration_device_policy, remote_activation_controls]

  - practice_id: SC.L2-3.13.14
    capability: network_boundary_protection
    pattern_id: NBP-021
    pattern_name: VoIP Protection
    actions:
      - id: NBP-021-01
        action: Configure VoIP security controls including encryption and access restrictions
        action_type: configuration
        evidence_outputs: [voip_security_config, voip_encryption_evidence]

  - practice_id: SC.L2-3.13.15
    capability: network_boundary_protection
    pattern_id: NBP-022
    pattern_name: Session Authenticity
    actions:
      - id: NBP-022-01
        action: Configure session authenticity protection using TLS, IPsec, or equivalent
        action_type: configuration
        evidence_outputs: [session_authenticity_config, tls_certificate_inventory]

  - practice_id: SC.L3-3.13.1e
    capability: network_boundary_protection
    pattern_id: NBP-023
    pattern_name: System Component Diversity
    actions:
      - id: NBP-023-01
        action: Implement diverse components to reduce single-vendor attack surface
        action_type: configuration
        evidence_outputs: [component_diversity_inventory, vendor_diversity_assessment]

  - practice_id: SC.L3-3.13.5e
    capability: network_boundary_protection
    pattern_id: NBP-024
    pattern_name: Function Relocation
    actions:
      - id: NBP-024-01
        action: Implement capability to redistribute system functions across infrastructure
        action_type: configuration
        evidence_outputs: [function_distribution_plan, relocation_procedure]

  # =============================================================================
  # DATA PROTECTION & CLASSIFICATION (DPC)
  # =============================================================================

  - practice_id: AC.L1-3.1.22
    capability: data_protection
    pattern_id: DPC-001
    pattern_name: Public Information Control
    actions:
      - id: DPC-001-01
        action: Define policy governing what information may be posted to public-facing systems
        action_type: policy
        evidence_outputs: [public_posting_policy]
      - id: DPC-001-02
        action: Implement review and approval process before public posting
        action_type: process
        evidence_outputs: [posting_approval_workflow, approval_records]

  - practice_id: AC.L2-3.1.3
    capability: data_protection
    pattern_id: DPC-002
    pattern_name: CUI Flow Control
    actions:
      - id: DPC-002-01
        action: Document CUI data flows including storage, processing, and transmission points
        action_type: policy
        evidence_outputs: [cui_data_flow_diagram]
      - id: DPC-002-02
        action: Configure Data Loss Prevention rules to control CUI movement
        action_type: configuration
        evidence_outputs: [dlp_policy_config, dlp_rule_export]

  - practice_id: AC.L2-3.1.22
    capability: data_protection
    pattern_id: DPC-003
    pattern_name: CUI Public Posting Prevention
    actions:
      - id: DPC-003-01
        action: Configure controls preventing CUI from being posted to publicly accessible systems
        action_type: configuration
        evidence_outputs: [public_posting_controls_config, dlp_external_sharing_rules]

  - practice_id: AC.L3-3.1.2e
    capability: data_protection
    pattern_id: DPC-004
    pattern_name: Restricted System and Component Access
    actions:
      - id: DPC-004-01
        action: Configure granular access restrictions for systems processing CUI
        action_type: configuration
