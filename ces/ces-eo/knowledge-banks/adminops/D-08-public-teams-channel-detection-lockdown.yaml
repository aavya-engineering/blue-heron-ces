  - https://graph.microsoft.us
  - https://compliance.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: |-
    - Teams Admin Center in GCC High uses `https://admin.teams.microsoft.us` [VERIFY] -- confirm the exact URL in your tenant.
    - Microsoft Graph Teams endpoints use `https://graph.microsoft.us/v1.0/groups` with the `resourceProvisioningOptions` filter, which is available in GCC High.
    - Sensitivity label container settings (enforcing Private visibility on CUI-labeled teams) are available in GCC High when labels are configured in `https://compliance.microsoft.us` > **Information protection** > **Labels** > container settings.
