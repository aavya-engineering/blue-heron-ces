  purpose: '`https://compliance.microsoft.us`) -- sensitivity label encryption settings'
- name: Azure Information Protection
  purpose: IRM integration
- name: Office Message Encryption
  purpose: OME) templates
configurationSteps:
  portalPath: //admin.exchange.microsoft.us > **Mail flow** > **Rules**.
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes InformationProtectionPolicy.Read
  graphApiEndpoint: GET https://graph.microsoft.us/v1.0/admin/exchange/transportRules
  graphApiPayloadExample: {}
  requiredPermissions:
  - InformationProtectionPolicy.Read.All
  - Exchange.ManageAsApp [VERIFY]
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-d-dataprotection/D-06/2026/03/
  format: CSV (transport rule inventory), JSON (IRM config, OME config, audit report)
  filenamePattern: D-06_EmailEncryption_{YYYYMMDD}_{HHmmss}_Monthly.json
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://admin.exchange.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: |-
    - Exchange Admin Center in GCC High uses `https://admin.exchange.microsoft.us`. `[VERIFY]` -- confirm the exact URL in your tenant, as some GCC High tenants may use a variant.
    - `Connect-ExchangeOnline` must use `-ExchangeEnvironmentName O365USGovGCCHigh`.
    - IRM/OME encryption in GCC High uses the Azure Government Azure Rights Management service. Verify `Get-IRMConfiguration` shows `AzureRMSLicensingEnabled: True`.
    - OME templates in GCC High function identically to commercial. The `SocialIdSignIn` option (allowing Google/Yahoo authentication for external recipients) should be evaluated for CU
