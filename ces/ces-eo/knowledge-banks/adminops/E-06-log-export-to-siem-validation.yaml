gccHighSpecifics:
  endpoints:
  - https://portal.azure.us
  - https://graph.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: |-
    - Data connector behavior in GCC High is functionally equivalent to commercial, but certain third-party connectors may have limited availability. Microsoft first-party connectors (Entra ID, Office 365, Defender suite, Azure Activity) are fully supported.
    - Ingestion latency baselines differ in GCC High. Establish a GCC High-specific baseline over 30 days and use that as the threshold for anomaly detection rather than commercial SLA numbers.
