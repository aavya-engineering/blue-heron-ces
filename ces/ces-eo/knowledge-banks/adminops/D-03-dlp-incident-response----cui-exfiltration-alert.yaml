configurationSteps:
  portalPath: '**Alert Triage:** //compliance.microsoft.us > **Data loss prevention** > **Alerts**. Identify the triggering
    DLP alert. Record alert ID, affected user UPN, content type, destination, and timestamp.'
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes User.ReadWrite.All
  - cmdlet: Update-MgUser
    parameters:
    - -MgUser
    - -UserId
    - -AccountEnabled
    - -MgInvalidateUserRefreshToken
    - -UserId
  graphApiEndpoint: PATCH https://graph.microsoft.us/v1.0/users/{affectedUserId}
  graphApiPayloadExample: {}
  requiredPermissions:
  - User.ReadWrite.All
  - Directory.ReadWrite.All
  - eDiscovery.ReadWrite.All
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-d-dataprotection/D-03/2026/03/
  format: JSON (containment record with actions taken, affected user, case reference), CSV (DLP alert export)
  filenamePattern: D-03_Containment_{YYYYMMDD}_{HHmmss}_{CaseName}.json
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://compliance.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
