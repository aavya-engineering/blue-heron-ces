controlId: "IA.L2-3.5.10"
relatedControlIds:
  - "IA.L1-3.5.2"
  - "IA.L2-3.5.4"
  - "SC.L2-3.13.10"
practiceStatement: See CMMC 2.0 Assessment Guide for full practice statement.
useCaseId: C-02
useCaseTitle: "App Secret Rotation"
domain: Credential & Secret Management
priority: P3 Medium
trigger: 'EXPIRY: Credential identified by C-01 scan within 14-day expiry window; or CHANGE: Scheduled quarterly rotation'
sodTier: Tier 2 (Config Manager)
entraRolesRequired:
- Application Administrator or Cloud Application Administrator
approvalRequired: true
services:
- name: Entra ID Application Registrations
  purpose: ''
- name: Microsoft Graph API
  purpose: Application resource type
- name: Azure Key Vault
  purpose: Secrets, Certificates
- name: ITSM system
  purpose: change ticket reference
configurationSteps:
  portalPath: //entra.microsoft.us > Applications > App registrations > select target application.
  powershellCmdlets:
  - cmdlet: Connect-MgGraph
    parameters:
    - -Environment USGov
    - -Scopes Application.ReadWrite.All
  - cmdlet: Add-MgApplicationPassword
    parameters:
    - -MgApplicationPassword
    - -ApplicationId
    - -PasswordCredential
    - -Date
    - -name
  - cmdlet: Remove-MgApplicationPassword
    parameters:
    - -MgApplicationPassword
    - -ApplicationId
    - -KeyId
  graphApiEndpoint: POST https://graph.microsoft.us/v1.0/applications/{appObjectId}/addPassword
  graphApiPayloadExample: {}
  requiredPermissions:
  - Application.ReadWrite.All (application)
evidenceArtifacts:
- type: Use Case Execution Evidence
  retentionPeriod: 7 years
  storageLocation: evidence-store/domain-c-credential/C-02/2026/03/
  format: 'JSON (fields: appObjectId, appClientId, oldKeyId, newKeyId, rotationDate, vaultSecretUri, overlapWindowEnd, verificationResult)'
  filenamePattern: C-02_AppSecretRotation_{YYYYMMDD}_{HHmmss}_{AppName}.json
  hashAlgorithm: SHA-256
gccHighSpecifics:
  endpoints:
  - https://portal.azure.us
  - https://graph.microsoft.us
  complianceBoundary: FedRAMP High + CMMC L2
  endpointValidation: All endpoints use .microsoft.us or .usgovcloudapi.net domains
  notes: The `login.microsoftonline.us` token endpoint must be used for GCC High tenants. Using `login.microsoftonline.com`
    will fail authentication. The Key Vault endpoint in Azure Government is `https://{vault-name}.vault.usgovcloudapi.net`
    rather than `https://{vault-name}.vault.azure.net`. Ensure all application configurations reference the `.us` and `.usgovcloudapi.net`
    URIs.
relatedPolicies: []
odpValues: []
dependencies:
  hardDependencies: []
  softDependencies: []
notes: ''
