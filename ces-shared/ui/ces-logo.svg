<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" role="img" aria-label="CES">
  <title>CES</title>
  <!-- Mark-only shield + checkmark. Uses currentColor so it inherits the header's text color
       (white on the navy .ces-header, dark on light surfaces like the Planner nav). The "CES"
       wordmark is supplied by adjacent text in each header, so the logo is the mark alone. -->
  <rect x="2" y="2" width="24" height="24" rx="0" ry="0"
        fill="none" stroke="currentColor" stroke-width="2.5"/>
  <polyline points="7,14 12,19 21,8"
            fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
