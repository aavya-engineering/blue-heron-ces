user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Dynamic Connection header for WebSocket upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Dynamic API backend mapping based on HTTP Referer
    map $http_referer $api_backend {
        default              http://ces:4000;
        "~*/stamper"         http://ces:5002;
        "~*/ao"              http://ces:5003;
        "~*/adminops"        http://ces:5003;
        "~*/eo"              http://ces:5004;
        "~*/evidenceops"     http://ces:5004;
        "~*/ec"              http://ces:4001;
        "~*/stacksim"        http://ces:4390;
    }

    # Dynamic frontend assets mapping for subpath proxying
    map $http_referer $assets_backend {
        default              http://ces:5173;
        "~*/stamper"         http://ces:5002;
        "~*/ao"              http://ces:5003;
        "~*/eo"              http://ces:5004;
    }

    include /etc/nginx/conf.d/*.conf;
}

