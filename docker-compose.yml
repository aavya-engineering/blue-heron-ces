services:

  # ── CES application (all 7 modules via supervisord) ──────────────────────
  ces:
    build:
      context: .
      dockerfile: Dockerfile
    image: ces:latest
    container_name: ces-app
    restart: unless-stopped
    env_file: .env                        # reads JWT_SECRET, ANTHROPIC_API_KEY etc.
    environment:
      - CES_PIPELINE_ROOT=/app/data
      - CES_ROOT=/app
      - PORT=4000
      - EC_PORT=4001
      - EC_HOST=0.0.0.0
      - EO_PORT=5004
      - CES_EO_BIND=0.0.0.0
      - CES_AO_BIND=0.0.0.0
      - CES_EO_OPERATOR_DEV_FALLBACK=1
      - REGISTRY_PATH=/app/ces/ces-stamper/src/registry/cmmc-l2-commands.registry.json
      - STORAGE_ROOT=/app/data
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
    volumes:
      # config files mounted read-only so changes apply on restart without rebuild
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
      - ./docker/start-walkthrough.sh:/app/docker/start-walkthrough.sh:ro
      - ./handoff/walkthrough:/app/handoff/walkthrough
      # persistent data volumes — SQLite (ces.db) lives in ces_data
      - ces_data:/app/data
      - ces_out:/app/out
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status muster-api 2>/dev/null | grep -q RUNNING"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s     # give the build time on first start
    # No ports exposed publicly — all external traffic goes through nginx below.
    # For debugging a single module directly uncomment the relevant line:
    #   - "4000:4000"   # muster-api
    #   - "5173:5173"   # muster-ui
    #   - "5002:5002"   # stamper
    #   - "5003:5003"   # adminops
    #   - "5004:5004"   # evidenceops
    #   - "4001:4001"   # evidence-collector
    #   - "4390:4390"   # stacksim
    #   - "4600:4600"   # demo-commander

  # ── Nginx reverse proxy (single public entry point) ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: ces-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP — also serves Let's Encrypt ACME challenge
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      ces:
        condition: service_healthy   # wait until supervisord reports no FATAL

# ── Named volumes ─────────────────────────────────────────────────────────
volumes:
  ces_data:          # SQLite ces.db + pipeline files  ← back this up
    driver: local
  ces_out:           # run outputs and evidence packages
    driver: local
  certbot_conf:      # Let's Encrypt certificates
    driver: local
  certbot_www:       # Let's Encrypt ACME webroot
    driver: local
